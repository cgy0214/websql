<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>系统设置</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/static/img/favicon.ico}" media="screen"/>
    <link rel="stylesheet" th:href="@{/static/css/layui.css}" media="all"/>
</head>
<style>
    body {
        background-color: #f0f2f5;
    }

    .layui-form-pane .layui-form-label {
        width: 110px;
    }

    .set-card {
        margin-bottom: 15px;
        border-radius: 6px;
    }

    .set-card .layui-card-header {
        background-color: #e9f7f5;
        color: #0f9d8f;
        font-weight: 600;
        letter-spacing: 1px;
        border-radius: 6px 6px 0 0;
        border-bottom: 1px solid #d9efec;
        height: 36px;
        line-height: 36px;
        padding: 0 15px;
        font-size: 14px;
    }

    .set-card .layui-card-header i {
        margin-right: 6px;
    }

    .cfg-grid .layui-form-item {
        display: flex;
        align-items: center;
        margin-bottom: 14px;
    }

    .cfg-grid .layui-form-label {
        width: auto;
        min-width: 130px;
        white-space: nowrap;
        overflow: visible;
        flex: none;
    }

    .cfg-grid .layui-input-inline {
        flex: 1;
        width: auto;
        min-width: 0;
    }

    .version-line {
        display: flex;
        align-items: center;
        padding: 2px 0 16px;
        font-size: 13px;
        color: #5a6478;
    }

    .version-line b {
        color: #333;
        font-weight: 600;
    }

    .version-line a {
        color: #16baaa;
        font-weight: 600;
    }

    .version-line .layui-badge-dot {
        margin: 0 6px;
    }

    .op-group {
        margin: 0 0 18px 15px;
    }

    .op-group-title {
        margin-bottom: 12px;
        padding-left: 8px;
        border-left: 3px solid #16baaa;
        font-size: 13px;
        color: #5a6478;
        font-weight: 600;
        line-height: 18px;
    }

    .btn-save {
        background-color: transparent;
        color: #16baaa;
        border: 1px solid #16baaa;
    }

    .btn-save:hover {
        background-color: #14a696 !important;
        color: #fff;
        border-color: #14a696;
    }

    .side-nav {
        position: fixed;
        right: 16px;
        top: 12%;
        width: 100px;
        background: #fff;
        border: 1px solid #e6e6e6;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 6px 0;
        z-index: 999;
        user-select: none;
    }

    .side-nav-item {
        display: block;
        padding: 7px 12px;
        font-size: 13px;
        color: #5a6478;
        cursor: pointer;
        border-left: 3px solid transparent;
        transition: all 0.2s;
    }

    .side-nav-item:hover {
        color: #16baaa;
        background: #f0fbfa;
    }

    .side-nav-item.active {
        color: #16baaa;
        border-left-color: #16baaa;
        background: #f0fbfa;
    }

    .set-page {
        margin: 15px;
    }

    @media (max-width: 1280px) {
        .side-nav {
            display: none;
        }
    }
</style>
<body>

<div class="set-page">
    <form class="layui-form layui-form-pane" action="" lay-filter="val-filter">
        <div class="layui-card set-card" id="sec-cfg">
            <div class="layui-card-header"><i class="layui-icon layui-icon-set"></i>参数配置<i class="layui-icon layui-icon-tips" title="帮助文档" style="margin-left:8px;font-size:14px;cursor:pointer;" onclick="window.open('https://gitee.com/boy_0214/websql/wikis/pages?sort_id=18062098&amp;doc_id=3405209','_blank')"></i></div>
            <div class="layui-card-body">
                <div class="layui-row layui-col-space6 cfg-grid">

                    <div class="layui-col-md12">
                        <div class="version-line">
                            <span>当前版本:</span>
                            <b th:text="${version.localVersion}"></b>
                            <span th:if="${version.push == true}">
                                <span class="layui-badge-dot"></span>
                                <a th:href="${version.link}" target="_blank">最新版本已发布,请及时更新!</a>
                            </span>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>数据加载</label>
                            <div class="layui-input-inline">
                                <select name="initDataSource" id="initDataSource">
                                    <option value="1">开启</option>
                                    <option value="2">关闭</option>
                                </select>
                                <input type="hidden" id="initDataSourceVal" th:value="${obj.initDataSource}">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right1">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>日志记录</label>
                            <div class="layui-input-inline">
                                <select name="enabledSqlLog" id="enabledSqlLog">
                                    <option value="1">开启</option>
                                    <option value="2">关闭</option>
                                </select>
                                <input type="hidden" id="enabledSqlLogVal" th:value="${obj.enabledSqlLog}">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right2">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>锁屏展示</label>
                            <div class="layui-input-inline">
                                <select name="enabledLockView" id="enabledLockView">
                                    <option value="0">开启</option>
                                    <option value="1">关闭</option>
                                </select>
                                <input type="hidden" id="enabledLockViewVal" th:value="${obj.enabledLockView}">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right3">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>文档展示</label>
                            <div class="layui-input-inline">
                                <select name="enabledHelp" id="enabledHelp">
                                    <option value="0">开启</option>
                                    <option value="1">关闭</option>
                                </select>
                                <input type="hidden" id="enabledHelpVal" th:value="${obj.enabledHelp}">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right4">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>提示信息</label>
                            <div class="layui-input-inline">
                                <select name="enabledHint" id="enabledHint">
                                    <option value="0">开启</option>
                                    <option value="1">关闭</option>
                                </select>
                                <input type="hidden" id="enabledHintVal" th:value="${obj.enabledHint}">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right8">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>windows通知</label>
                            <div class="layui-input-inline">
                                <select name="enabledNotification" id="enabledNotification">
                                    <option value="0">开启</option>
                                    <option value="1">关闭</option>
                                </select>
                                <input type="hidden" id="enabledNotificationVal"
                                       th:value="${obj.enabledNotification}">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right9">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>分页条数</label>
                            <div class="layui-input-inline">
                                <input type="text" id="pageLimitMax" name="pageLimitMax"
                                       th:value="${obj.pageLimitMax}"
                                       lay-affix="number"
                                       class="layui-input">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right5">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>语句限制</label>
                            <div class="layui-input-inline">
                                <input type="text" id="riskText" name="riskText" th:value="${obj.riskText}"
                                       class="layui-input"
                                       lay-affix="clear">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right6">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>失败次数</label>
                            <div class="layui-input-inline">
                                <input type="text" id="failLogin" name="failLogin" th:value="${obj.failLogin}"
                                       lay-affix="number"
                                       class="layui-input">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right7">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>默认首页</label>
                            <div class="layui-input-inline">
                                <input type="text" id="homePage" name="homePage" th:value="${obj.homePage}"
                                       class="layui-input"
                                       lay-affix="clear">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-right12">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md12">
                        <input type="hidden" name="id" th:value="${obj.id}">
                        <div style="text-align:center;padding-top:8px;">
                            <button class="layui-btn layui-btn-sm layui-btn-radius btn-save" lay-submit lay-filter="save">
                                <i class="layui-icon layui-icon-add-1"></i> 保存设置
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="layui-card set-card" id="sec-ai">
            <div class="layui-card-header"><i class="layui-icon layui-icon-component"></i>AI配置</div>
            <div class="layui-card-body">
                <div class="layui-row layui-col-space6 cfg-grid">

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>地址</label>
                            <div class="layui-input-inline">
                                <input type="text" id="aiUrl" name="aiUrl" th:value="${obj.aiUrl}"
                                       class="layui-input"
                                       lay-affix="clear">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-ai-url">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>KEY</label>
                            <div class="layui-input-inline">
                                <input type="password" id="aiKey" name="aiKey" th:value="${obj.aiKey}"
                                       class="layui-input"
                                       lay-affix="clear">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-ai-key">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>模型名称</label>
                            <div class="layui-input-inline">
                                <input type="text" id="aiModelName" name="aiModelName" th:value="${obj.aiModelName}"
                                       class="layui-input"
                                       lay-affix="clear">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-ai-model">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>temperature温度</label>
                            <div class="layui-input-inline">
                                <input type="text" id="aiTemperature" name="aiTemperature" th:value="${obj.aiTemperature}"
                                       lay-affix="number"
                                       class="layui-input">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-ai-temperature">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>最大tokens</label>
                            <div class="layui-input-inline">
                                <input type="text" id="aiMaxTokens" name="aiMaxTokens" th:value="${obj.aiMaxTokens}"
                                       lay-affix="number"
                                       class="layui-input">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-ai-tokens">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" pane>最大历史消息</label>
                            <div class="layui-input-inline">
                                <input type="text" id="aiMaxMessages" name="aiMaxMessages" th:value="${obj.aiMaxMessages}"
                                       lay-affix="number"
                                       class="layui-input">
                            </div>
                            <div class="layui-form-mid layui-text-em" lay-on="tips-ai-messages">
                                <i class="layui-icon layui-icon-tips"></i>
                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md12">
                        <div style="text-align:center;padding-top:8px;">
                            <button class="layui-btn layui-btn-sm layui-btn-radius btn-save" lay-submit lay-filter="save">
                                <i class="layui-icon layui-icon-add-1"></i> 保存设置
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="layui-card set-card" id="sec-ops">
            <div class="layui-card-header"><i class="layui-icon layui-icon-survey"></i>维护操作</div>
            <div class="layui-card-body">
                <div class="op-group">
                    <div class="op-group-title">数据清理</div>
                    <div class="layui-btn-container">
                        <button class="layui-btn layui-btn-primary layui-border-red layui-btn-radius layui-btn-sm"
                                onclick="btnPost('删除全部SQL记录','logManager/deleteLog/1');return false;">
                            <i class="layui-icon layui-icon-clear"></i>删除全部SQL记录
                        </button>
                        <button class="layui-btn layui-btn-primary layui-border-red layui-btn-radius layui-btn-sm"
                                onclick="btnPost('删除全部登陆记录','logManager/deleteLog/2');return false;">
                            <i class="layui-icon layui-icon-clear"></i>删除全部登陆记录
                        </button>
                        <button class="layui-btn layui-btn-primary layui-border-red layui-btn-radius layui-btn-sm"
                                onclick="btnPost('删除全部作业记录','timingManager/jobLogDelete');return false;">
                            <i class="layui-icon layui-icon-clear"></i>删除全部作业记录
                        </button>
                        <button class="layui-btn layui-btn-primary layui-border-red layui-btn-radius layui-btn-sm"
                                onclick="btnPost('删除全部SQL列表','sqlManager/sqlTextDeleteAll');return false;">
                            <i class="layui-icon layui-icon-clear"></i>删除全部SQL列表
                        </button>
                        <button class="layui-btn layui-btn-primary layui-border-red layui-btn-radius layui-btn-sm"
                                onclick="btnPost('删除全部数据源','settingManager/deleteDataSourceAll');return false;">
                            <i class="layui-icon layui-icon-clear"></i>删除全部数据源
                        </button>
                        <button class="layui-btn layui-btn-primary layui-border-red layui-btn-radius layui-btn-sm"
                                onclick="btnPost('删除全部监测记录','detectionManager/deleteLogAll');return false;">
                            <i class="layui-icon layui-icon-clear"></i>删除全部监测记录
                        </button>
                        <button class="layui-btn layui-btn-primary layui-border-red layui-btn-radius layui-btn-sm"
                                onclick="btnPost('删除全部AI记录','aiManager/clearAll');return false;">
                            <i class="layui-icon layui-icon-clear"></i>删除全部AI记录
                        </button>
                        <button class="layui-btn layui-btn-primary layui-border-red layui-btn-radius layui-btn-sm"
                                onclick="btnPost('删除全部枢易方舟','bigdataManager/deleteTaskAll');return false;">
                            <i class="layui-icon layui-icon-clear"></i>删除全部枢易方舟
                        </button>
                        <button class="layui-btn layui-btn-primary layui-border-red layui-btn-radius layui-btn-sm"
                                onclick="btnPost('删除全部枢易方舟实例','bigdataManager/deleteInstanceAll');return false;">
                            <i class="layui-icon layui-icon-clear"></i>删除全部枢易方舟实例
                        </button>
                    </div>
                </div>
                <div class="op-group">
                    <div class="op-group-title">系统维护</div>
                    <div class="layui-btn-container">
                        <button class="layui-btn layui-btn-primary layui-border-blue layui-btn-radius layui-btn-sm"
                                onclick="btnPost('重建数据源连接池','settingManager/reloadDataSourceAll');return false;">
                            <i class="layui-icon layui-icon-refresh"></i>重建数据源连接池
                        </button>
                        <button class="layui-btn layui-btn-primary layui-border-blue layui-btn-radius layui-btn-sm"
                                onclick="btnPost('清理系统缓存','settingManager/clearCache');return false;">
                            <i class="layui-icon layui-icon-refresh"></i>清理系统缓存
                        </button>
                    </div>
                </div>
                <div class="op-group">
                    <div class="op-group-title">数据备份</div>
                    <div class="layui-btn-container">
                        <button class="layui-btn layui-btn-primary layui-border-yellow layui-btn-radius layui-btn-sm"
                                onclick="downloadFile('settingManager/dataBackups');return false;">
                            <i class="layui-icon layui-icon-download-circle"></i>数据备份导出
                        </button>
                        <button type="button" class="layui-btn layui-btn-primary layui-border-yellow layui-btn-radius layui-btn-sm" id="upload-data">
                            <i class="layui-icon layui-icon-upload"></i>数据备份导入
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-card set-card" id="sec-export">
            <div class="layui-card-header" lay-on="tips-export" style="cursor:pointer;"><i class="layui-icon layui-icon-download-circle"></i>导出记录<i class="layui-icon layui-icon-tips" style="margin-left:8px;font-size:14px;"></i></div>
            <div class="layui-card-body" style="padding-top: 10px;">
                <div class="layui-form-item" style="margin-bottom: 12px;">
                    <div class="layui-input-inline">
                        <select name="state" id="exportState" layui-form-sm>
                            <option value=""></option>
                            <option value="导出中">生成中</option>
                            <option value="完成">已完成</option>
                            <option value="失败">生成失败</option>
                        </select>
                    </div>
                    <button class="layui-btn layui-btn-sm layui-btn-primary layui-border-green search-btn" lay-submit
                            lay-filter="export-search">
                        <i class="layui-icon layui-icon-search"> </i>查 询
                    </button>
                </div>
                <table class="layui-hide" id="exportTable" lay-filter="exportTable"></table>
            </div>
        </div>

        <div class="layui-card set-card" id="sec-alert">
            <div class="layui-card-header"><i class="layui-icon layui-icon-notice"></i>告警模板配置</div>
            <div class="layui-card-body" style="padding-top: 8px;">
                <table class="layui-hide" id="dataTable" lay-filter="dataTable"></table>
            </div>
        </div>
    </form>
</div>
<div class="side-nav" id="sideNav">
    <a class="side-nav-item active" data-target="sec-cfg">参数配置</a>
    <a class="side-nav-item" data-target="sec-ai">AI配置</a>
    <a class="side-nav-item" data-target="sec-ops">维护操作</a>
    <a class="side-nav-item" data-target="sec-export">导出记录</a>
    <a class="side-nav-item" data-target="sec-alert">告警模板</a>
</div>
<script th:src="@{/static/layui.js}"></script>
<script th:replace="~{base::ctx}"/>
<script type="text/html" id="toolbarTable">
    <div class="layui-clear-space">
        <a class="layui-btn layui-btn-xs" lay-event="view">内容</a>
        <a class="layui-btn layui-bg-red layui-btn-xs" lay-event="delete">删除</a>
    </div>
</script>
<script type="text/html" id="exportToolbarTable">
    <div class="layui-clear-space">
        <a class="layui-btn layui-btn-xs" lay-event="view">查看</a>
        <a class="layui-btn layui-bg-purple layui-btn-xs" lay-event="download">下载</a>
    </div>
</script>
<script type="text/html" id="addBtnHtml">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm layui-btn-primary layui-border-yellow" onclick="openPage('新增告警配置',ctx+'settingManager/addMessageTemplatePage');return false;">新增</button>
        <button class="layui-btn layui-btn-sm  layui-btn-primary layui-border-blue" id="search"  lay-filter="table-search">刷新</button>
    </div>
</script>
<script>

    layui.use(function () {
        const layer = layui.layer;
        const form = layui.form;
        const $ = layui.jquery;
        const util = layui.util;

                }
            });
        });

        $("#enabledLockView").each(function () {
            $(this).children("option").each(function () {

        $("#enabledHelp").each(function () {

        //上传初始化
        upload.render({

            }
        });

        // 提示信息
        const tipsConfig = {tips: [2, '#16b777']};
        util.on('lay-on', {
            'tips-right1': function () {
                layer.tips('开启时，启动项目时会主动加载数据源，启动速度慢，受链接失败影响。<br>关闭时，项目启动不会加载数据源，需要手动加载数据源，启动速度快，不会受链接失败影响。', this, tipsConfig);
            },
            'tips-right2': function () {
                layer.tips('开启时，执行SQL会记录SQL执行日志及返回结果，时间长会增大数据库文件;<br>关闭时,不记录SQL执行日志，会缺失操作记录找不到操作人。', this, tipsConfig);
            },
            'tips-right3': function () {
                layer.tips('开启时会显示锁屏按钮，且需要输入密码重新进入;<br>关闭时会隐藏锁屏按钮', this, tipsConfig);
            },
            'tips-right4': function () {
                layer.tips('开启时会显示帮助按钮;<br>关闭时会隐藏帮助按钮', this, tipsConfig);
            },
            'tips-right5': function () {
                layer.tips('默认查询时分页最大查询条数<br>SQL执行时没有分页条件会走此限制,sql中有分页条件不会走此限制<br>填0不开启此限制。<br>支持mysql、oracle、H2、postgres、达梦、人大金仓、神州通用', this, tipsConfig);
            },
            'tips-right6': function () {
                layer.tips('执行SQL时检查语句包含危险关键词不允许执行;<br>小写输入关键词支持多个用,分割', this, tipsConfig);
            },
            'tips-right7': function () {
                layer.tips('账号登录失败次数,超过次数状态将被禁用!<br>普通账号使用超管账号修改用户状态<br>填写‘-1’不开启禁用账号，这样会很危险!<br>admin账号重置密码 <a target="_blank" href="https://gitee.com/boy_0214/websql/wikis/pages?sort_id=7676296&doc_id=3405209#8-%E5%BF%98%E8%AE%B0%E7%AE%A1%E7%90%86%E5%91%98%E5%AF%86%E7%A0%81">gitee Wiki</a>', this, tipsConfig);
            },
            'tips-right8': function () {
                layer.tips('编辑器写SQL时会提示选中的数据源所有表及字段!<br>如果数据库中超过上万字段不建议开启会卡死!<br>支持mysql、oracle、H2、postgres、达梦、人大金仓、神州通用', this, tipsConfig);
            },
            'tips-right9': function () {
                layer.tips('执行SQL完成后,页面离开态会进行Windows系统通知!<br>关闭将不会在发送通知，但不影响执行SQL使用。', this, tipsConfig);
            },
            'tips-right10': function () {
                layer.tips('导入数据源时,确保地址正确能连接，不会覆盖原有数据!<br>如果导入的团队不存在，会绑定右上角选中的团队信息中。<br> 导入多条数据出现1条失败其余的都会成功,下次只需要导入失败条数。', this, tipsConfig);
            },
            'tips-right11': function () {
                layer.tips('上传备份文件(ZIP/RAR/7Z)进行数据恢复,会覆盖当前系统数据,请谨慎操作!', this, tipsConfig);
            },
            'tips-right12': function () {
                layer.tips('默认首页URL路径,设置后需用户有对应权限方可进入。', this, tipsConfig);
            },
            'tips-ai-url': function () {
                layer.tips('OpenAI兼容接口地址,默认为火山方舟;<br>留空时使用环境变量 OPENAI_API_URL 或 application.properties 中的默认值', this, tipsConfig);
            },
            'tips-ai-key': function () {
                layer.tips('API密钥,为空时AI功能(智能助手/智能分析)不可用;<br>留空时使用环境变量 OPENAI_API_KEY 或 application.properties 中的默认值', this, tipsConfig);
            },
            'tips-ai-model': function () {
                layer.tips('使用的模型名称,如 deepseek-v4-flash-ga-260731;<br>留空时使用环境变量 OPENAI_MODEL_NAME 或 application.properties 中的默认值', this, tipsConfig);
            },
            'tips-ai-temperature': function () {
                layer.tips('生成温度,值越大回答越发散随机,默认 0.0;<br>留空时使用环境变量 OPENAI_TEMPERATURE 或 application.properties 中的默认值', this, tipsConfig);
            },
            'tips-ai-tokens': function () {
                layer.tips('单次回答最大生成的token数量,默认 1024;<br>留空时使用环境变量 OPENAI_MAX_TOKENS 或 application.properties 中的默认值', this, tipsConfig);
            },
            'tips-ai-messages': function () {
                layer.tips('对话保留的最大历史消息条数,默认 20;<br>留空时使用环境变量 OPENAI_MAX_MESSAGES 或 application.properties 中的默认值;<br>保存后新对话立即生效,其他AI配置需重启系统生效', this, tipsConfig);
            },
            'tips-export': function () {
                layer.tips('导出记录仅记录异步全量导出，其他导出不会记录。', this, {tips: [1, '#16b777']});
            }
        })

        form.on('submit(save)', function (data) {
            const field = data.field;
            window.localStorage.removeItem('site');
            post(ctx + "settingManager/updateSysSetUp", field, (res) => {
                layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2});
            });
            return false;
        });

        table.render({
            elem: '#dataTable',
            url: ctx + 'settingManager/messageTemplateList',
            defaultToolbar: ['filter', 'exports', 'print'],
            page: true,
            height: '500',
            toolbar: '#addBtnHtml',
            cols: [
                [
                    {field: 'id', title: 'id', sort: true, fixed: true},
                    {field: 'name', title: '名称', sort: true, fixed: true},
                    {field: 'type', title: '类型', sort: true, fixed: true},
                    {field: 'url', title: '地址', sort: true, fixed: true},
                    {field: 'secret', title: '签名', sort: true, fixed: true},
                    {field: 'content', title: '内容', sort: true, fixed: true, width: 200},
                    {field: 'createUser', title: '创建人', sort: true, fixed: true},
                    {field: 'createTime', title: '创建时间',width: 200, sort: true, fixed: true},
                    {fixed: 'right', title: '操作', width: 100, toolbar: '#toolbarTable'}
                ]
            ],
            parseData: res => parseData(res)
        });
        table.on('tool(dataTable)', function (obj) {
            var data = obj.data;
            switch (obj.event) {
                case 'view':
                    const content = laytpl('<div style="margin: 5px;"><pre class="layui-code">{{= d.content}}</pre></div>')
                        .render({content: data.content});
                    openContent("查看内容", content);
                    break;
                case 'delete':
                    layer.confirm("您确认要删除此任务吗？", function () {
                        post(ctx + "settingManager/deleteMessageTemplate?id=" + data.id, null, (res) => {
                            layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2}, () => {
                                if(res.code === 200) {
                                    table.reloadData('dataTable', {
                                        scrollPos: true,
                                        page: {curr: 1}
                                    });
                                }
                            });
                        })
                    })
                    break;
            }
        });

        form.on('submit(table-search)', function (data) {
            const field = data.field;
            table.reloadData('dataTable', {
                scrollPos: true,
                where: field,
                page: {curr: 1}
            });
            return false;
        });

        // 导出管理表格
        table.render({
            elem: '#exportTable',
            url: ctx + 'settingManager/exportFilesLogList',
            toolbar: true,
            defaultToolbar: ['filter', 'exports', 'print'],
            page: true,
            height: '400',
            cols: [
                [
                    {field: 'id', title: '任务ID', sort: true, fixed: true},
                    {field: 'dataBaseName', title: '数据源名称', sort: true, fixed: true},
                    {field: 'userId', title: '操作人', sort: true, fixed: true},
                    {field: 'beginDate', title: '开始时间', sort: true, fixed: true},
                    {field: 'endDate', title: '结束时间', sort: true, fixed: true},
                    {field: 'state', title: '状态', sort: true, fixed: true},
                    {field: 'message', title: '描述', sort: true, fixed: true},
                    {fixed: 'right', title: '操作', width: 134, minWidth: 125, toolbar: '#exportToolbarTable'}
                ]
            ],
            parseData: res => parseData(res)
        });
        table.on('tool(exportTable)', function (obj) {
            var data = obj.data;
            switch (obj.event) {
                case 'view':
                    let params = data.sqlText;
                    let content1 = laytpl('<div style="margin: 5px;"><pre class="layui-code">{{= d.content}}</pre></div>').render({
                        content: util.unescape(params)
                    });
                    openContent("查看SQL内容", content1);
                    break;
                case 'download':
                    if (data.state !== "完成") {
                        return layer.msg("请等待完成再下载！");
                    }
                    window.open(ctx + "sqlManager/downloadExcelFile?id=" + data.id);
                    break;
            }
        });

        form.on('submit(export-search)', function (data) {
            const field = data.field;
            table.reloadData('exportTable', {
                scrollPos: true,
                where: field,
                page: {curr: 1}
            });
            return false;
        });

        // 右侧页面导航:点击定位
        $('#sideNav .side-nav-item').on('click', function () {
            if (navDragged) {
                return;
            }
            const target = '#' + $(this).data('target');
            $('html, body').animate({scrollTop: $(target).offset().top - 10}, 300);
        });

        // 右侧页面导航:支持上下拖动
        let navDragged = false;
        let navDragging = false;
        let navStartY = 0;
        let navStartTop = 0;
        const nav = $('#sideNav');
        nav.on('mousedown', function (e) {
            navDragging = true;
            navDragged = false;
            navStartY = e.clientY;
            navStartTop = nav.offset().top;
            nav.css('cursor', 'move');
            e.preventDefault();
        });
        $(document).on('mousemove', function (e) {
            if (!navDragging) {
                return;
            }
            if (Math.abs(e.clientY - navStartY) > 5) {
                navDragged = true;
            }
            const maxTop = $(window).height() - nav.outerHeight() - 10;
            const newTop = Math.min(Math.max(navStartTop + (e.clientY - navStartY), 10), maxTop);
            nav.css('top', newTop + 'px');
        });
        $(document).on('mouseup', function () {
            navDragging = false;
            nav.css('cursor', '');
        });

        // 右侧页面导航:滚动高亮
        function updateSideNav() {
            let currentId = null;
            const scrollTop = $(window).scrollTop() + 100;
            const cards = $('.layui-card.set-card');
            cards.each(function () {
                if ($(this).offset().top <= scrollTop) {
                    currentId = $(this).attr('id');
                }
            });
            const atBottom = $(window).scrollTop() + $(window).height() >= $(document).height() - 5;
            if (currentId === null || atBottom) {
                currentId = cards.last().attr('id');
            }
            $('#sideNav .side-nav-item').each(function () {
                $(this).toggleClass('active', $(this).data('target') === currentId);
            });
        }

        $(window).on('scroll', updateSideNav);
        updateSideNav();

    });


    /**
     * 按钮请求后台操作
     * @param msg
     * @param url
     */
    function btnPost(msg, url) {
        layer.confirm("确认" + msg + "？", function () {
            post(ctx + url, null, (res) => {
                layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2});
            });
        });
    }

    /**
     * 下载请求
     * @param url
     */
    function downloadFile(url) {
        layer.confirm("导出的数据没有加密,确保数据安全？", function () {
            window.open(ctx + url);
            layer.closeAll();
        });
    }

</script>
