<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>WebSql-AI智能助手</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/static/img/favicon.ico}" media="screen"/>
    <link rel="stylesheet" th:href="@{/static/css/layui.css}" media="all"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .ai-header {
            flex-shrink: 0;
            background: linear-gradient(135deg, #16baaa 0%, #0f9d8f 100%);
            color: #fff;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 12px rgba(22, 186, 170, 0.35);
            z-index: 10;
        }

        .ai-header .ai-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
            letter-spacing: -1px;
        }

        .ai-header .ai-title {
            flex: 1;
            min-width: 0;
        }

        .ai-header .ai-title h3 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
        }

        .ai-header .ai-title .ai-sub {
            font-size: 10.5px;
            opacity: 0.85;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ai-chip-btn,
        .ai-close {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
        }

        .ai-chip-btn:hover,
        .ai-close:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.08);
        }

        .ai-chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            scroll-behavior: smooth;
            background: radial-gradient(circle at 20% 10%, rgba(22, 186, 170, 0.05), transparent 40%),
            radial-gradient(circle at 80% 90%, rgba(15, 157, 143, 0.06), transparent 40%), #f0f2f5;
        }

        .ai-chat::-webkit-scrollbar {
            width: 6px;
        }

        .ai-chat::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }

        .ai-message {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-message .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            margin-top: 2px;
        }

        .ai-message.assistant .msg-avatar {
            background: linear-gradient(135deg, #16baaa, #0f9d8f);
            color: #fff;
            box-shadow: 0 2px 6px rgba(22, 186, 170, 0.4);
        }

        .ai-message.user {
            flex-direction: row-reverse;
        }

        .ai-message.user .msg-avatar {
            background: linear-gradient(135deg, #2ec4b6, #16baaa);
            color: #fff;
            box-shadow: 0 2px 6px rgba(22, 186, 170, 0.4);
        }

        .ai-message .msg-bubble {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.7;
            word-break: break-word;
            white-space: normal;
        }

        .ai-message.assistant .msg-bubble {
            background: #fff;
            border: 1px solid #e8ecf3;
            border-top-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            color: #2b3245;
        }

        .ai-message.user .msg-bubble {
            background: linear-gradient(135deg, #16baaa, #2ec4b6);
            color: #fff;
            border-top-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(22, 186, 170, 0.25);
        }

        .ai-message .msg-bubble p {
            margin: 0 0 6px;
        }

        .ai-message .msg-bubble p:last-child {
            margin-bottom: 0;
        }

        .ai-message .msg-bubble strong {
            font-weight: 600;
        }

        .thinking-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 2px;
            margin-right: 6px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #16baaa;
            animation: blink 1.2s infinite;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0.25;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .ai-code {
            margin: 0;
            background: #f7f9fc;
            border: 1px solid #e8ecf3;
            border-radius: 8px;
            padding: 10px 12px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 12px;
            line-height: 1.8;
            color: #1f2d3d;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }

        .ai-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .ai-action {
            font-size: 11px;
            color: #16baaa;
            cursor: pointer;
            border: 1px solid #16baaa;
            border-radius: 6px;
            padding: 3px 10px;
            background: rgba(22, 186, 170, 0.06);
            transition: all 0.2s;
            user-select: none;
        }

        .ai-action:hover {
            background: #16baaa;
            color: #fff;
        }

        .ai-err {
            color: #e45757;
            font-size: 13px;
        }

        .ai-input-area {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid #e8ecf3;
            padding: 10px 14px 12px;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.03);
        }

        .ai-input-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f5f7fb;
            border: 1px solid #e4e8f0;
            border-radius: 14px;
            padding: 10px 10px 10px 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .ai-input-box:focus-within {
            border-color: #16baaa;
            box-shadow: 0 0 0 3px rgba(22, 186, 170, 0.12);
        }

        .ai-input-box textarea {
            flex: 1 1 auto;
            border: none;
            background: transparent;
            resize: none;
            overflow-y: hidden;
            font-size: 13.5px;
            line-height: 22px;
            height: 22px;
            max-height: 100px;
            outline: none;
            padding: 0;
            color: #2b3245;
            font-family: inherit;
        }

        .ai-input-box textarea::placeholder {
            color: #9aa3b2;
        }

        .ai-send-btn {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #16baaa, #0f9d8f);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.2s;
            box-shadow: 0 2px 6px rgba(22, 186, 170, 0.35);
        }

        .ai-send-btn:hover {
            transform: scale(1.06);
        }

        .ai-send-btn:active {
            transform: scale(0.95);
        }

        .ai-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .ai-input-tips {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            padding: 0 4px;
        }

        .ai-input-tips .ai-ds-tag {
            font-size: 11px;
            color: #8a93a6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ai-input-tips .ai-disclaimer {
            font-size: 10.5px;
            color: #b0b7c4;
            flex-shrink: 0;
        }

        .ai-empty {
            text-align: center;
            color: #9aa3b2;
            padding: 36px 16px;
            font-size: 13px;
            line-height: 2;
        }

        .ai-empty .ai-empty-icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: block;
        }

        .ai-reco-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .ai-reco-chip {
            display: inline-block;
            padding: 6px 12px;
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 16px;
            color: #16baaa;
            font-size: 12px;
            line-height: 1.6;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .ai-reco-chip:hover {
            border-color: #16baaa;
            background: rgba(22, 186, 170, 0.08);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
<div class="ai-header">
    <div class="ai-logo">AI</div>
    <div class="ai-title">
        <h3>AI 智能助手</h3>
        <div class="ai-sub">基于当前库表 · 支持多轮对话</div>
    </div>
    <button class="ai-chip-btn" id="newChatBtn" title="新对话">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="#fff" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round"/>
            <path d="M20 3v5h-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
    <button class="ai-close" id="closeBtn" title="关闭">✕</button>
</div>

<div class="ai-chat" id="chatHistory"></div>

<div class="ai-input-area">
    <input type="hidden" th:value="${database}" name="dataBaseName" id="dataBaseName"/>
    <input type="hidden" th:value="${table}" name="tableName" id="tableName"/>
    <div class="ai-input-box">
        <textarea id="question" rows="1" placeholder="输入自然语言生成SQL，可多轮追问..."></textarea>
        <button class="ai-send-btn" id="sendBtn" title="发送">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    <div class="ai-input-tips">
        <span class="ai-ds-tag" id="tableTag">库表: 未知</span>
        <span class="ai-disclaimer">内容由AI生成，仅供参考</span>
    </div>
</div>

<script th:src="@{/static/layui.js}"></script>
<script th:replace="~{base::ctx}"></script>
<script th:src="@{/static/lay-config.js}"></script>
<script>
    const SQL_KEYWORD = ['select', 'insert', 'update', 'delete', 'from', 'where', 'order by', 'limit', 'offset', 'create', 'drop', 'alter', 'truncate', 'rename', 'set', 'show', 'desc', 'explain', 'begin', 'commit', 'rollback', 'lock', 'unlock', 'grant', 'revoke', 'call', 'declare', 'procedure', 'function', 'trigger', 'view', 'index'];

    layui.use(['jquery', 'layer'], function () {
        const $ = layui.jquery;
        const layer = layui.layer;

        const chatHistory = document.getElementById('chatHistory');
        const questionEl = document.getElementById('question');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        let requesting = false;
        let msgSeq = 0;

        const dataBaseName = document.getElementById('dataBaseName').value;
        const tableName = document.getElementById('tableName').value;
        const dsLabel = (dataBaseName || '未知') + (tableName ? ' · ' + tableName : '');
        document.getElementById('tableTag').textContent = '库表: ' + dsLabel;

        const escapeHtml = function (str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        };

        // 矫正模型给的换行错误问题
        const keywordHtml = function (text, index) {
            if (text == null || text === '') {
                return text;
            }
            let t = escapeHtml(text);
            t = t.replace(/&lt;br\s*\/?&gt;/ig, '\n').replace(/<br\s*\/?>/ig, '\n');
            for (let i = 0; i < SQL_KEYWORD.length; i++) {
                const key = SQL_KEYWORD[i];
                if (t.toLowerCase().indexOf(key) !== -1 && index === 0) {
                    return t.replace(new RegExp('\\b(' + key + ')\\b', 'gi'), '$1\n');
                }
                if (t.toLowerCase().indexOf(key) !== -1 && index > 0) {
                    return t.replace(new RegExp('\\b(' + key + ')\\b', 'gi'), '\n $1 \n');
                }
            }
            return t;
        };

        const appendMessage = function (role, content) {
            msgSeq++;
            const avatar = role === 'assistant' ? '🤖' : '👤';
            const div = document.createElement('div');
            div.className = 'ai-message ' + role;
            div.id = 'msg' + msgSeq;
            div.innerHTML = '<div class="msg-avatar">' + avatar + '</div>' +
                '<div class="msg-bubble">' + (role === 'assistant' && content === '' ?
                    '<span class="thinking-dots"><span></span><span></span><span></span></span>AI思考中...' :
                    escapeHtml(content)) + '</div>';
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div;
        };

        //流式请求
        const startStream = function (q, msgDiv) {
            const bubble = $(msgDiv).find('.msg-bubble')[0];
            const url = ctx + 'aiManager/stream?text=' + encodeURIComponent(q) +
                '&dataBaseName=' + encodeURIComponent(dataBaseName) + '&tableName=' + encodeURIComponent(tableName);
            const source = new EventSource(url);
            let aiAnswer = '';
            let index = 0;
            requesting = true;
            sendBtn.disabled = true;

            source.onmessage = function (e) {
                const t = keywordHtml(e.data, index);
                index++;
                if (t !== '') {
                    aiAnswer += t;
                    bubble.innerHTML = '<pre class="ai-code">' + aiAnswer + '</pre>';
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }
            };

            //服务端清除历史信号
            source.addEventListener('clear_history', function () {
                chatHistory.innerHTML = '';
                renderRecommend();
            });

            source.onerror = function () {
                source.close();
                requesting = false;
                sendBtn.disabled = false;
                if (aiAnswer.trim() === '') {
                    bubble.innerHTML = '<span class="ai-err">AI 未返回内容，请重试~</span>';
                } else {
                    bubble.innerHTML = '<pre class="ai-code">' + aiAnswer + '</pre>' +
                        '<div class="ai-actions">' +
                        '<a class="ai-action" data-exec>执行SQL</a>' +
                        '<a class="ai-action" data-copy>复制</a>' +
                        '</div>';
                }
                chatHistory.scrollTop = chatHistory.scrollHeight;
            };
        };

        const sendMessage = function (q) {
            if (requesting) {
                layer.msg('AI正在回答中，请稍候~', {icon: 2});
                return false;
            }
            const question = String(q == null ? '' : q).trim();
            if (question === '') {
                layer.msg('请输入问题~', {icon: 2});
                return false;
            }
            const recoWrap = document.getElementById('recoWrap');
            if (recoWrap) {
                recoWrap.remove();
            }
            appendMessage('user', question);
            const msgDiv = appendMessage('assistant', '');
            startStream(question, msgDiv);
            questionEl.value = '';
            autoResize();
            return false;
        };

        //推荐初始化
        const renderRecommend = function () {
            chatHistory.innerHTML = '';
            post(ctx + 'aiManager/queryRecommend', null, function (res) {
                const wrap = document.createElement('div');
                wrap.className = 'ai-empty';
                wrap.id = 'recoWrap';
                let html = '<span class="ai-empty-icon">🤖</span>' +
                    '<div>你好，我是 AI 智能助手，可以帮你编写 SQL</div>' +
                    '<div style="font-size:12px;opacity:.7;">选择或输入提示开始对话，可基于结果多轮追问</div>';
                if (res.code === 200 && res.data != null && res.data.length > 0) {
                    html += '<div class="ai-reco-list">';
                    res.data.forEach(function (item) {
                        html += '<a class="ai-reco-chip" href="javascript:void(0);" data-question="' + escapeHtml(item) + '">' + escapeHtml(item) + '</a>';
                    });
                    html += '</div>';
                }
                wrap.innerHTML = html;
                chatHistory.appendChild(wrap);
            });
        };

        //推荐/执行/复制事件
        chatHistory.addEventListener('click', function (e) {
            const chip = e.target.closest('.ai-reco-chip');
            if (chip) {
                sendMessage(chip.getAttribute('data-question'));
                return;
            }
            const exec = e.target.closest('[data-exec]');
            if (exec) {
                if (window.parent) {
                    window.parent.postMessage({type: 'executeSQL', sql: $(exec).closest('.msg-bubble').find('.ai-code')[0].innerText}, '*');
                }
                return;
            }
            const copy = e.target.closest('[data-copy]');
            if (copy) {
                navigator.clipboard.writeText($(copy).closest('.msg-bubble').find('.ai-code')[0].innerText)
                    .then(function () {
                        layer.msg('已复制');
                    });
            }
        });

        //新对话
        newChatBtn.onclick = function () {
            if (requesting) {
                layer.msg('AI正在回答中，请稍候~', {icon: 2});
                return false;
            }
            post(ctx + 'aiManager/clear', null, function () {
                renderRecommend();
            });
        };

        //关闭抽屉
        window.closeAiPage = function () {
            try {
                const index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
            } catch (e) {
                console.error('关闭AI助手抽屉失败', e);
            }
        };
        document.getElementById('closeBtn').onclick = closeAiPage;

        //发送事件
        sendBtn.onclick = function () {
            const q = questionEl.value;
            if (q.trim() === '') {
                layer.msg('请输入问题~', {icon: 2});
                return false;
            }
            sendMessage(q);
        };

        //回车发送,Shift+Enter换行
        questionEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        //textarea自适应高度
        const autoResize = function () {
            questionEl.style.height = 'auto';
            questionEl.style.height = Math.min(questionEl.scrollHeight, 100) + 'px';
        };
        questionEl.addEventListener('input', autoResize);
        autoResize();

        renderRecommend();
    });
</script>
</body>
</html>
