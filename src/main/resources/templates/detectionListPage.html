<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>检测任务管理</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/static/img/favicon.ico}" media="screen"/>
    <link rel="stylesheet" th:href="@{/static/css/layui.css}" media="all"/>
    <style>
        td[data-field="messageName"] .layui-table-cell {
            overflow: visible;
        }

        td[data-field="messageName"] .layui-form-select {
            width: 100%;
        }

        td[data-field="messageName"] .layui-form-select .layui-select-title,
        td[data-field="messageName"] .layui-form-select .layui-select-title input {
            height: 28px;
            line-height: 28px;
        }

        td[data-field="messageName"] .layui-form-select .layui-edge {
            top: 45%;
        }

        td[data-field="messageName"] .layui-form-select dl {
            top: 32px;
            padding: 2px 0;
            max-height: 220px;
        }

        /* 选项尺寸与列表框保持一致，layui默认行高36px偏大 */
        td[data-field="messageName"] .layui-form-select dl dd,
        td[data-field="messageName"] .layui-form-select dl dt {
            line-height: 28px;
            padding: 0 10px;
        }

        td[data-field="messageName"] .layui-form-selectup dl {
            top: auto;
            bottom: 32px;
        }
    </style>
</head>
<body>
<form class="layui-form">
    <div class="layui-panel">
        <div style="margin: 15px;">
            <div class="layui-form-item">
                <label class="layui-form-label">名称:</label>
                <div class="layui-input-inline">
                    <input type="text" name="name" id="name" placeholder="请输入名称" class="layui-input"
                           lay-affix="clear">
                </div>
                <label class="layui-form-label">作业数据源:</label>
                <div class="layui-input-inline">
                    <input type="text" name="dataBaseName" id="dataBaseName" placeholder="请输入作业数据源"
                           class="layui-input" lay-affix="clear">
                </div>
                <label class="layui-form-label">状态:</label>
                <div class="layui-input-inline">
                    <select name="state" lay-filter="state">
                        <option value=""></option>
                        <option value="开始监控">开始监控</option>
                        <option value="停止监控">停止监控</option>
                    </select>
                </div>
                <div class="layui-input-normal">
                    <button class="layui-btn layui-btn-primary layui-border-green search-btn" lay-submit
                            lay-filter="table-search">
                        <i class="layui-icon layui-icon-search"> </i>查 询
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="layui-panel" style="margin-top: 15px;">
        <div class="layui-form nowrap">
            <table class="layui-hide" id="dataTable" lay-filter="dataTable"></table>
        </div>
    </div>
</form>
</body>
<script th:src="@{/static/layui.js}"></script>
<script th:src="@{/static/base64.min.js}"></script>
<script th:replace="~{base::ctx}"/>
<script type="text/html" id="toolbarTable">
    <div class="layui-clear-space">
        <a class="layui-btn layui-btn-xs" lay-event="view">SQL</a>
        <a class="layui-btn layui-bg-blue layui-btn-xs" lay-event="updateCron">CRON</a>
        <a class="layui-btn layui-bg-purple layui-btn-xs" lay-event="updateState">{{= d.state=='停止监控'?
            '开始':'停止'}}</a>
        <a class="layui-btn layui-bg-red layui-btn-xs" lay-event="delete">删除</a>
    </div>
</script>
<script>
    layui.use(function () {
        const layer = layui.layer;
        const form = layui.form;
        const $ = layui.jquery;
        const table = layui.table;
        const laytpl = layui.laytpl;
        const util = layui.util;

        //告警模板列表，用于渲染行内的告警模板下拉框
        let messageTemplateList = [];

        const renderTable = function () {
        table.render({
            elem: '#dataTable',
            url: ctx + 'detectionManager/list',
            toolbar: true,
            defaultToolbar: ['filter', 'exports', 'print', helpToolbarConfig('https://gitee.com/boy_0214/websql/wikis/pages?sort_id=16605240&doc_id=3405209')],
            page: true,
            height: '525',
            cols: [
                [
                    {field: 'id', title: 'id', sort: true, fixed: true},
                    {
                        field: 'name', title: '名称', sort: true, fixed: true, templet: function (d) {
                            return '<a href="/detectionManager/reportPage?id=' + d.id + '" class="layui-table-link">' + d.name + '</a>'
                        }
                    },
                    {field: 'dataBaseName', title: '作业数据源', sort: true, fixed: true},
                    {field: 'expression', title: '告警表达式', sort: true, fixed: true},
                    {
                        field: 'cron', title: 'CRON表达式', sort: true, fixed: true, width: 200, templet: function (d) {
                            if (!d.cron) {
                                return '';
                            }
                            return '<a href="javascript:;" class="layui-table-link" lay-event="cronTimes">' + d.cron + '</a>';
                        }
                    },
                    {field: 'alarmLevel', title: '告警级别', sort: true, fixed: true},
                    {
                        field: 'messageName', title: '告警模板', sort: true, fixed: true, width: 180, templet: function (d) {
                            let options = '<option value="">未设置</option>';
                            messageTemplateList.forEach(item => {
                                const selected = String(item.code) === String(d.messageId) ? 'selected' : '';
                                options += '<option value="' + item.code + '" ' + selected + '>' + item.value + '</option>';
                            });
                            return '<select lay-filter="templateSelect" data-id="' + d.id + '" lay-search>' + options + '</select>';
                        }
                    },
                    {field: 'state', title: '状态', sort: true, fixed: true},
                    {field: 'createUser', title: '创建人', sort: true, fixed: true},
                    {field: 'createTime', title: '创建时间', width: 200, sort: true, fixed: true},
                    {fixed: 'right', title: '操作', width: 270, toolbar: '#toolbarTable'}
                ]
            ],
            parseData: res => parseData(res),
            done: function () {
                form.render('select');
            }
        });
        };

        post(ctx + "settingManager/findMessageTemplateList", null, (res) => {
            if (res && res.code === 0) {
                messageTemplateList = res.data || [];
            }
            renderTable();
        });

        $(document).on('mousedown', 'td[data-field="messageName"] .layui-form-select', function () {
            const $select = $(this);
            const $body = $select.closest('.layui-table-body');
            if ($body.length === 0) {
                return;
            }
            const remainHeight = $body.offset().top + $body.height() - ($select.offset().top + $select.height());
            $select.toggleClass('layui-form-selectup', remainHeight < 240);
        });

        form.on('select(templateSelect)', function (obj) {
            const taskId = $(obj.elem).attr('data-id');
            const messageId = obj.value;
            if (!messageId) {
                layer.msg('暂不支持清空告警模板', {icon: 2});
                table.reloadData('dataTable');
                return;
            }
            post(ctx + "detectionManager/executeOnce/6/" + taskId + "?messageId=" + messageId, null, (res) => {
                layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2}, () => {
                    if (res.code === 200) {
                        table.reloadData('dataTable');
                    }
                });
            });
        });

        table.on('tool(dataTable)', function (obj) {
            var data = obj.data;
            switch (obj.event) {
                case 'view':
                    let str = Base64.decode(data.sqlContent) || "";
                    const content = laytpl('<div style="margin: 5px;"><pre class="layui-code">{{= d.content}}</pre></div>')
                        .render({content: str});
                    openContent("查看作业SQL内容", content);
                    break;
                case 'cronTimes':
                    post(ctx + "detectionManager/getNextExecuteTime?id=" + data.id, null, (res) => {
                        if (res.code === 200) {
                            layer.msg('下次执行时间: ' + (res.msg || '无'), {icon: 1});
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    });
                    break;
                case 'updateCron':
                    layer.prompt({
                        formType: 2,
                        value: data.cron,
                        anim: 'slideLeft',
                        title: '请输入Cron表达式',
                        area: ['300px', '200px']
                    }, function (value, index) {
                        layer.confirm("确认修改CRON？", function () {
                            post(ctx + "detectionManager/executeOnce/3/" + data.id + "?cron=" + value, null, (res) => {
                                layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2}, () => {
                                    if (res.code === 200) {
                                        $(".search-btn").click();
                                        layer.closeAll();
                                    }
                                });
                            })
                        });
                    });
                    break;
                case 'updateState':
                    var path = data.state === '开始监控' ? '1' : '2';
                    var message = data.state === '开始监控' ? '确认要停止监控吗?' : '确认要开始监控吗?';
                    layer.confirm(message, function () {
                        post(ctx + "detectionManager/executeOnce/" + path + "/" + data.id, null, (res) => {
                            layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2}, () => {
                                if (res.code === 200) $(".search-btn").click();
                            });
                        })
                    })
                    break;
                case 'delete':
                    layer.confirm("您确认要删除此任务吗？<br/><span style='color: red;'>该任务的报表记录也将被一并删除！</span>", function () {
                        post(ctx + "detectionManager/executeOnce/4/" + data.id, null, (res) => {
                            layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2}, () => {
                                if (res.code === 200) $(".search-btn").click();
                            });
                        })
                    })
                    break;
            }
        });

        form.on('submit(table-search)', function (data) {
            const field = data.field;
            table.reloadData('dataTable', {
                scrollPos: true,
                where: field,
                page: {curr: 1}
            });
            return false;
        });
    });
</script>
</html>
