<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>WebSql-AI智能分析</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/static/img/favicon.ico}" media="screen"/>
    <link rel="stylesheet" th:href="@{/static/css/layui.css}" media="all"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .ai-header {
            flex-shrink: 0;
            background: linear-gradient(135deg, #16baaa 0%, #0f9d8f 100%);
            color: #fff;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 12px rgba(22, 186, 170, 0.35);
            z-index: 10;
        }

        .ai-header .ai-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            flex-shrink: 0;
            letter-spacing: -1px;
        }

        .ai-header .ai-title {
            flex: 1;
            min-width: 0;
        }

        .ai-header .ai-title h3 {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
        }

        .ai-header .ai-title .ai-sub {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ai-header .ai-datasource {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 11px;
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ai-close {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
        }

        .ai-close:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.08);
        }

        .ai-chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            scroll-behavior: smooth;
            background: radial-gradient(circle at 20% 10%, rgba(22, 186, 170, 0.05), transparent 40%),
            radial-gradient(circle at 80% 90%, rgba(15, 157, 143, 0.06), transparent 40%), #f0f2f5;
        }

        .ai-chat::-webkit-scrollbar {
            width: 6px;
        }

        .ai-chat::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }

        .ai-message {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-message .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            margin-top: 2px;
        }

        .ai-message.assistant .msg-avatar {
            background: linear-gradient(135deg, #16baaa, #0f9d8f);
            color: #fff;
            box-shadow: 0 2px 6px rgba(22, 186, 170, 0.4);
        }

        .ai-message.user {
            flex-direction: row-reverse;
        }

        .ai-message.user .msg-avatar {
            background: linear-gradient(135deg, #2ec4b6, #16baaa);
            color: #fff;
            box-shadow: 0 2px 6px rgba(22, 186, 170, 0.4);
        }

        .ai-message .msg-bubble {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.7;
            word-break: break-word;
            white-space: normal;
        }

        .ai-message.assistant .msg-bubble {
            background: #fff;
            border: 1px solid #e8ecf3;
            border-top-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            color: #2b3245;
        }

        .ai-message.user .msg-bubble {
            background: linear-gradient(135deg, #16baaa, #2ec4b6);
            color: #fff;
            border-top-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(22, 186, 170, 0.25);
        }

        .ai-message .msg-bubble p {
            margin: 0 0 6px;
        }

        .ai-message .msg-bubble p:last-child {
            margin-bottom: 0;
        }

        .ai-message .msg-bubble strong {
            font-weight: 600;
        }

        .ai-message .msg-bubble span[style*="color"] {
            font-weight: 600;
        }

        .thinking-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 2px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #16baaa;
            animation: blink 1.2s infinite;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0.25;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .ai-input-area {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid #e8ecf3;
            padding: 10px 14px 12px;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.03);
        }

        .ai-input-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f5f7fb;
            border: 1px solid #e4e8f0;
            border-radius: 14px;
            padding: 10px 10px 10px 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .ai-input-box:focus-within {
            border-color: #16baaa;
            box-shadow: 0 0 0 3px rgba(22, 186, 170, 0.12);
        }

        .ai-input-box textarea {
            flex: 1 1 auto;
            border: none;
            background: transparent;
            resize: none;
            overflow-y: hidden;
            font-size: 13.5px;
            line-height: 22px;
            height: 22px;
            max-height: 100px;
            outline: none;
            padding: 0;
            color: #2b3245;
            font-family: inherit;
        }

        .ai-input-box textarea::placeholder {
            color: #9aa3b2;
        }

        .ai-send-btn {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #16baaa, #0f9d8f);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.2s;
            box-shadow: 0 2px 6px rgba(22, 186, 170, 0.35);
        }

        .ai-send-btn:hover {
            transform: scale(1.06);
        }

        .ai-send-btn:active {
            transform: scale(0.95);
        }

        .ai-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .ai-input-tips {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            padding: 0 4px;
        }

        .ai-input-tips .ai-ds-tag {
            font-size: 11px;
            color: #8a93a6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ai-input-tips .ai-disclaimer {
            font-size: 10.5px;
            color: #b0b7c4;
        }

        .ai-empty {
            text-align: center;
            color: #9aa3b2;
            padding: 40px 20px;
            font-size: 13px;
            line-height: 2;
        }

        .ai-empty .ai-empty-icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>
<body>
<div class="ai-header">
    <div class="ai-logo">AI</div>
    <div class="ai-title">
        <h3>AI 智能数据分析</h3>
        <div class="ai-sub">基于当前结果集 · 支持多轮追问</div>
    </div>
    <button class="ai-close" id="closeBtn" title="关闭">✕</button>
</div>

<div class="ai-chat" id="chatHistory"></div>

<div class="ai-input-area">
    <div class="ai-input-box">
        <textarea id="question" rows="1" placeholder="基于分析结果继续提问，如：哪个产品价格最高？"></textarea>
        <button class="ai-send-btn" id="sendBtn" title="发送">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    <div class="ai-input-tips">
        <span class="ai-ds-tag" id="tableTag"></span>
        <span class="ai-disclaimer">内容由AI生成，仅供参考</span>
    </div>
</div>

<script th:src="@{/static/layui.js}"></script>
<script th:replace="~{base::ctx}"></script>
<script th:src="@{/static/lay-config.js}"></script>
<script>
    layui.use(['jquery', 'layer'], function () {
        const $ = layui.jquery;
        const layer = layui.layer;

        let analysisParams = null;
        try {
            analysisParams = JSON.parse(sessionStorage.getItem('aiDataAnalysisParams'));
        } catch (e) {
            analysisParams = null;
        }

        const chatHistory = document.getElementById('chatHistory');
        const questionEl = document.getElementById('question');
        const sendBtn = document.getElementById('sendBtn');
        let requesting = false;
        let msgSeq = 0;

        const escapeHtml = function (str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        };

        const appendMessage = function (role, content) {
            msgSeq++;
            const avatar = role === 'assistant' ? '🤖' : '👤';
            const div = document.createElement('div');
            div.className = 'ai-message ' + role;
            div.id = 'msg' + msgSeq;
            div.innerHTML = '<div class="msg-avatar">' + avatar + '</div>' +
                '<div class="msg-bubble">' + (role === 'assistant' ? '<span class="thinking-dots"><span></span><span></span><span></span></span> AI分析中...' : escapeHtml(content)) + '</div>';
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div;
        };

        //流式请求
        const streamRequest = function (params, msgDiv) {
            const bubble = $(msgDiv).find('.msg-bubble')[0];
            let aiAnswer = '';
            let lastIndex = 0;
            let pending = '';
            let dataBuffer = '';
            let firstEvent = true;
            const processLine = function (line) {
                if (line === '') {
                    const content = dataBuffer;
                    dataBuffer = '';
                    //首个事件为"连接成功"状态消息,忽略并替换为AI分析内容
                    if (firstEvent) {
                        firstEvent = false;
                        if (content.indexOf('连接成功') !== -1) {
                            return;
                        }
                    }
                    aiAnswer += content;
                    if (aiAnswer.trim() !== '') {
                        bubble.innerHTML = aiAnswer;
                    }
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                } else if (line.startsWith('data:')) {
                    dataBuffer = line.substring(5);
                } else if (line.startsWith(':')) {
                    //忽略注释行
                } else {
                    //多行data延续
                    dataBuffer += '\n' + line;
                }
            };
            requesting = true;
            sendBtn.disabled = true;
            const xhr = new XMLHttpRequest();
            xhr.open('POST', ctx + 'aiManager/streamDataAnalysis', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onprogress = function () {
                const newText = xhr.responseText.substring(lastIndex);
                lastIndex = xhr.responseText.length;
                pending += newText;
                let idx;
                while ((idx = pending.indexOf('\n')) >= 0) {
                    processLine(pending.substring(0, idx));
                    pending = pending.substring(idx + 1);
                }
            };
            xhr.onload = function () {
                if (pending.length > 0) {
                    processLine(pending.replace(/\n+$/, ''));
                    pending = '';
                }
                if (dataBuffer.length > 0) {
                    aiAnswer += dataBuffer;
                    dataBuffer = '';
                }
                if (xhr.status !== 200) {
                    bubble.innerHTML = '请求失败，状态码:' + xhr.status;
                } else if (aiAnswer.trim() === '') {
                    bubble.innerHTML = 'AI未返回内容，请重试~';
                } else {
                    bubble.innerHTML = aiAnswer;
                }
                requesting = false;
                sendBtn.disabled = false;
                questionEl.disabled = false;
                chatHistory.scrollTop = chatHistory.scrollHeight;
            };
            xhr.onerror = function () {
                bubble.innerHTML = 'AI分析请求失败~';
                requesting = false;
                sendBtn.disabled = false;
                questionEl.disabled = false;
            };
            xhr.send(JSON.stringify(params));
        };

        //发送消息(question为空时为首轮分析)
        const sendMessage = function (question) {
            if (requesting) {
                layer.msg('AI正在回答中，请稍候~', {icon: 2});
                return false;
            }
            const q = (question == null ? '' : String(question)).trim();
            if (!analysisParams) {
                layer.msg('未获取到分析参数，请重新点击AI智能分析~', {icon: 2});
                return false;
            }
            if (q !== '') {
                appendMessage('user', q);
            }
            const msgDiv = appendMessage('assistant', '');
            questionEl.disabled = true;
            const params = $.extend({}, analysisParams, {question: q});
            streamRequest(params, msgDiv);
            return false;
        };

        //自动发起首轮分析
        if (analysisParams) {
            let tables = '';
            if (analysisParams.tableNameList && analysisParams.tableNameList.length > 0) {
                tables = analysisParams.tableNameList.join(',');
            }
            $('#tableTag').text('数据表: ' + (tables || '未知'));
            if (analysisParams.data && analysisParams.data.length > 0) {
                $('#tableTag').text('数据表: ' + (tables || '未知') + ' · 共' + analysisParams.data.length + '行');
            }
            sendMessage('');
        } else {
            chatHistory.innerHTML = '<div class="ai-empty"><span class="ai-empty-icon">📊</span>请先在结果集工具栏点击「AI智能分析」按钮</div>';
        }

        //关闭抽屉
        window.closeAiAnalysis = function () {
            try {
                const index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
            } catch (e) {
                console.error('关闭AI分析抽屉失败', e);
            }
        };
        document.getElementById('closeBtn').onclick = closeAiAnalysis;

        //发送事件
        sendBtn.onclick = function () {
            const q = questionEl.value;
            if (q.trim() === '') {
                layer.msg('请输入问题~', {icon: 2});
                return false;
            }
            sendMessage(q);
            questionEl.value = '';
        };

        //回车发送,Shift+Enter换行
        questionEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        //textarea自适应高度
        const autoResize = function () {
            questionEl.style.height = 'auto';
            questionEl.style.height = Math.min(questionEl.scrollHeight, 100) + 'px';
        };
        questionEl.addEventListener('input', autoResize);
        autoResize();
    });
</script>
</body>
</html>
