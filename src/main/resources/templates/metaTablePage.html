<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>元数据管理</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/static/img/favicon.ico}" media="screen"/>
    <link rel="stylesheet" th:href="@{/static/css/layui.css}" media="all"/>
    <style>
        .small-input {
            width: 350px;
            height: 36px;
            font-size: 14px;
        }
        #div-tree {
            background: #fff;
            padding: 8px 0;
        }
        #div-tree .layui-tree-set {
            position: relative;
            padding: 2px 0;
        }
        #div-tree .layui-tree-txt {
            font-size: 14px;
            color: #333;
            font-weight: 400;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            display: inline-block;
            background: transparent;
        }
        #div-tree .layui-tree-set:not(:has(.layui-tree-set)) > .layui-tree-entry > .layui-tree-txt {
            color: #16b777 !important;
            font-weight: 600;
        }
        #div-tree .layui-tree-txt:hover {
            background: #e6f7f2;
            color: #16b777 !important;
        }
        #div-tree .layui-tree-txt.layui-tree-checked,
        #div-tree .layui-tree-set.layui-tree-checked > .layui-tree-txt {
            background: #16b777;
            color: #fff !important;
        }
        #div-tree .layui-tree-iconClick .layui-tree-icon {
            transition: transform 0.3s ease;
        }
        #div-tree .layui-tree-icon {
            background: #16b777;
            border-radius: 4px;
            width: 18px !important;
            height: 18px !important;
            line-height: 18px !important;
        }
        #div-tree .layui-tree-icon:after {
            border-color: #fff !important;
        }
        #div-tree .layui-tree-entry {
            position: relative;
        }
        #div-tree .layui-tree-set::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 0;
            bottom: 20px;
            width: 1px;
            background: #ddd;
        }
        #div-tree .layui-tree-set::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            width: 12px;
            height: 1px;
            background: #ddd;
        }
        #div-tree .layui-tree-set:last-child::before {
            height: 50%;
            bottom: auto;
            top: 0;
        }
        #div-tree .layui-tree-set:only-child::before,
        #div-tree .layui-tree-set:only-child::after {
            display: none;
        }
        #div-tree > .layui-tree-set::before,
        #div-tree > .layui-tree-set::after {
            display: none;
        }
        .layui-input-group {
            margin-bottom: 10px;
        }
        .tree-panel {
            background: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 0;
        }
    </style>
</head>
<body>
<form class="layui-form" onsubmit="return false;">
    <div class="layui-panel" style="background: #e9e9e96b;">
        <div class="layui-row">
            <div class="layui-col-xs3">
                <div class="layui-panel tree-panel" style="padding: 10px;">
                    <div class="layui-input-group">
                        <input type="text" placeholder="search..." class="layui-input small-input" id="searchInput">
                        <div class="layui-input-suffix">
                            <button type="button" class="layui-btn layui-btn-sm" lay-on="reload">重置</button>
                        </div>
                    </div>
                    <div id="div-tree" style="height:650px;overflow-y:auto;font-size: 15px;"></div>
                </div>
            </div>
            <div class="layui-col-xs9">
                <div class="layui-card">
                    <div class="layui-card-header">数据库信息</div>
                    <div class="layui-card-body">
                        <div id="view1">无数据...</div>
                    </div>
                </div>
                <div class="layui-card" id="showView2" style="display:none;">
                    <div class="layui-card-header">数据表信息</div>
                    <div class="layui-card-body">
                        <div id="view2">无数据...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
</body>
<script th:src="@{/static/layui.js}"></script>
<script th:src="@{/static/base64.min.js}"></script>
<script th:replace="~{base::ctx}"/>
<script id="DataBaseView" type="text/html">
    <table class="layui-table">
        <colgroup>
            <col width="80">
            <col width="220">
            <col width="80">
            <col width="220">
            <col width="80">
            <col width="220">
            <col width="80">
            <col width="220">
        </colgroup>
        <tbody>
        <tr>
            <td><b>名称</b></td>
            <td>
                <span style="cursor: pointer; color: #1E9FFF;" onclick="copyTableText('{{= d.dataSourceKey}}')" title="点击复制">{{= d.dataSourceKey}}</span>
            </td>
            <td><b>标识</b></td>
            <td>
                <span style="cursor: pointer; color: #16baaa;" onclick="copyTableText('{{= d.sourceIdentifier}}')" title="点击复制数据源标识">{{= d.sourceIdentifier}}</span>
            </td>
            <td><b>类型</b></td>
            <td>{{= d.productName}}</td>
            <td><b>版本</b></td>
            <td>{{= d.productVersion}}</td>
        </tr>
        <tr>
            <td><b>驱动名</b></td>
            <td>{{= d.driverName}}</td>
            <td><b>只读</b></td>
            <td>{{= d.readOnly}}</td>
            <td><b>事务</b></td>
            <td>{{= d.supportsTransactions}}</td>
            <td><b>表数量</b></td>
            <td>{{= d.tableCount}}</td>
        </tr>
        </tbody>
    </table>
</script>
<!-- 与tableSqlPageMeta对应. -->
<script id="tableView" type="text/html">
    <table class="layui-table">
        <colgroup>
            <col width="80">
            <col width="220">
            <col width="80">
            <col width="300">
            <col width="80">
            <col width="100">
        </colgroup>
        <tbody>
        <tr>
            <td><b>表名称</b></td>
            <td><span style="cursor: pointer; color: #1E9FFF;" onclick="copyTableText('{{= d.tableName}}')" title="点击复制">{{= d.tableName}}</span></td>
            <td><b>表注释</b></td>
            <td>{{= d.tableComment}}</td>
            <td><b>字段数量</b></td>
            <td>{{= d.fieldCount}}</td>
        </tr>
        </tbody>
    </table>
    <hr class="layui-border-green">
    <table class="layui-table" lay-size="sm">
        <colgroup>
            <col width="200">
            <col width="200">
            <col width="200">
            <col width="200">
            <col width="200">
        </colgroup>
        <thead>
        <tr>
            <th>字段名称</th>
            <th>字段注释</th>
            <th>字段类型</th>
            <th>是否NULL</th>
            <th>是否自增</th>
        </tr>
        </thead>
        <tbody>
        {{# layui.each(d.tablesMetaList, function(index, item){ }}
        <tr>
            <td>{{= item.columnName }}</td>
            <td>{{= item.comment || '' }}</td>
            <td>{{= item.typeName }}</td>
            <td>{{= item.nullable }}</td>
            <td>{{= item.autoIncrement }}</td>
        </tr>
        {{# }); }}
        </tbody>
    </table>
    <hr class="layui-border-green">
    <!-- 索引描述 -->
    <table class="layui-table" lay-size="sm">
        <colgroup>
            <col width="200">
            <col width="200">
            <col width="200">
        </colgroup>
        <thead>
        <tr>
            <th>索引名称</th>
            <th>索引字段</th>
            <th>是否唯一</th>
        </tr>
        </thead>
        <tbody>
        {{# layui.each(d.tablesIndexMetaList, function(index, item){ }}
        <tr>
            <td>{{= item.indexName }}</td>
            <td>{{= item.columnName }}</td>
            <td>{{= item.nonUnique || '' }}</td>
        </tr>
        {{# }); }}
        </tbody>
    </table>
    <hr class="layui-border-green">
    <!-- 主键描述 -->
    <table class="layui-table" lay-size="sm">
        <colgroup>
            <col width="200">
            <col width="200">
            <col width="200">
        </colgroup>
        <thead>
        <tr>
            <th>主键名称</th>
            <th>主键字段</th>
            <th>主键序列</th>
        </tr>
        </thead>
        <tbody>
        {{# layui.each(d.tablesKeysMetaList, function(index, item){ }}
        <tr>
            <td>{{= item.pkName }}</td>
            <td>{{= item.columnName }}</td>
            <td>{{= item.keySeq || '' }}</td>
        </tr>
        {{# }); }}
        </tbody>
    </table>

</script>
<script>
    layui.use(function () {
        const laytpl = layui.laytpl;
        const util = layui.util;
        const tree = layui.tree;
        const $ = layui.jquery;
        const layer = layui.layer;

        let treeData = [];
        // 记录已加载表数据的数据库
        let loadedDatabases = {};
        // 当前是否为搜索模式
        let isSearchMode = false;
        // 搜索延迟定时器
        let searchTimer = null;

        //树呈现
        tree.render({
            elem: '#div-tree',
            data: treeData,
            showCheckbox: false,
            onlyIconControl: true,
            id: 'tree-id-1',
            isJump: false,
            click: function (obj) {
                const data = obj.data;
                if (data.children && data.children.length > 0) {
                    const $elem = $(obj.elem);
                    const $entry = $elem.closest('.layui-tree-entry');
                    const $iconClick = $entry.find('.layui-tree-iconClick');
                    if ($iconClick.length > 0) {
                        $iconClick.trigger('click');
                    }
                }
                if (data.field === "database" && !loadedDatabases[data.title] && !isSearchMode) {
                    loadTablesByDatabase(data.title, obj);
                    return;
                }
                if (data.field === "database") {
                    const dbNode = findDatabaseNode(data.title);
                    if (dbNode) {
                        showDatabaseInfo(dbNode);
                        return;
                    }
                }
                showDatabaseInfo(data);
            }
        });

        /**
         * 显示数据库信息
         */
        function showDatabaseInfo(data) {
            if (!data.tableMeta) {
                return;
            }
            data.tableMeta.tableCount = data.tableCount || 0;
            data.tableMeta.fieldCount = data.fieldCount || 0;
            const DataBaseView = document.getElementById('DataBaseView').innerHTML;
            const view1 = document.getElementById('view1');
            laytpl(DataBaseView).render(data.tableMeta, function (str) {
                view1.innerHTML = str;
            });
            if (data.field === "database") {
                $("#showView2").hide();
            } else {
                const tableView = document.getElementById('tableView').innerHTML;
                const view2 = document.getElementById('view2');
                laytpl(tableView).render(data.tableMeta, function (str) {
                    view2.innerHTML = str;
                });
                $("#showView2").show();
            }
        }

        /**
         * 加载数据库列表（只加载数据库节点）
         */
        function loadDatabaseList() {
            isSearchMode = false;
            loadedDatabases = {};
            post(ctx + "sqlManager/metaDatabaseList", null, (res) => {
                if (res.code === 200) {
                    treeData = res.data;
                    tree.reload('tree-id-1', {
                        data: res.data
                    });
                }
            });
        }

        /**
         * 根据数据库名加载表列表
         */
        function loadTablesByDatabase(database, obj) {
            const loadIndex = layer.load(0);
            $.ajax({
                type: "post",
                url: ctx + "sqlManager/metaTableListByDatabase?database=" + encodeURIComponent(database),
                async: true,
                dataType: "json",
                contentType: "application/json",
                success: function (res) {
                    layer.close(loadIndex);
                    if (res.code === 200) {
                        loadedDatabases[database] = true;
                        updateDatabaseChildren(database, res.data);
                        setTimeout(function() {
                            var $treeEntries = $('#div-tree .layui-tree-entry');
                            $treeEntries.each(function() {
                                var $entry = $(this);
                                var title = $entry.find('.layui-tree-txt').text();
                                if (title === database) {
                                    var $iconClick = $entry.find('.layui-tree-iconClick');
                                    if ($iconClick.length > 0) {
                                        $iconClick.trigger('click');
                                    }
                                }
                            });
                        }, 100);
                        if (res.data && res.data.length > 0) {
                            const firstTable = res.data[0];
                            if (firstTable && firstTable.tableMeta) {
                                const dbNode = findDatabaseNode(database);
                                if (dbNode) {
                                    dbNode.tableCount = res.data.length;
                                    if (!dbNode.tableMeta) {
                                        dbNode.tableMeta = {};
                                    }
                                    dbNode.tableMeta.productName = firstTable.tableMeta.productName;
                                    dbNode.tableMeta.productVersion = firstTable.tableMeta.productVersion;
                                    dbNode.tableMeta.driverName = firstTable.tableMeta.driverName;
                                    dbNode.tableMeta.readOnly = firstTable.tableMeta.readOnly;
                                    dbNode.tableMeta.supportsTransactions = firstTable.tableMeta.supportsTransactions;
                                    showDatabaseInfo(dbNode);
                                }
                            }
                        }
                    } else {
                        layer.msg(res.msg || '加载表列表失败', {icon: 2});
                    }
                },
                error: function () {
                    layer.close(loadIndex);
                    layer.msg('加载表列表失败', {icon: 2});
                }
            });
        }

        /**
         * 查找数据库节点
         */
        function findDatabaseNode(database) {
            for (let i = 0; i < treeData.length; i++) {
                if (treeData[i].title === database) {
                    return treeData[i];
                }
            }
            return null;
        }

        /**
         * 更新数据库节点的子节点
         */
        function updateDatabaseChildren(database, tables) {
            for (let i = 0; i < treeData.length; i++) {
                if (treeData[i].title === database) {
                    treeData[i].children = tables;
                    treeData[i].tableCount = tables.length;
                    break;
                }
            }
            tree.reload('tree-id-1', {
                data: treeData
            });
        }

        /**
         * 后端搜索数据库和表
         */
        function searchFromBackend(keyword) {
            if (!keyword || keyword.trim() === '') {
                loadDatabaseList();
                return;
            }
            isSearchMode = true;
            const loadIndex = layer.load(0);
            $.ajax({
                type: "post",
                url: ctx + "sqlManager/searchMetaTree?keyword=" + encodeURIComponent(keyword),
                async: true,
                dataType: "json",
                contentType: "application/json",
                success: function (res) {
                    layer.close(loadIndex);
                    if (res.code === 200) {
                        treeData = res.data;
                        res.data.forEach(function(db) {
                            if (db.children && db.children.length > 0) {
                                loadedDatabases[db.title] = true;
                            }
                        });
                        tree.reload('tree-id-1', {
                            data: res.data
                        });
                    } else {
                        layer.msg(res.msg || '搜索失败', {icon: 2});
                    }
                },
                error: function () {
                    layer.close(loadIndex);
                    layer.msg('搜索失败', {icon: 2});
                }
            });
        }

        // 刷新树
        util.event('lay-on', {
            reload: function () {
                $("#searchInput").val('');
                loadDatabaseList();
            }
        });

        // 初始加载数据库列表
        loadDatabaseList();

        // 搜索输入事件（延迟搜索，避免频繁请求）
        $('#searchInput').on('keyup', function () {
            const keyword = $(this).val();
            // 清除之前的定时器
            if (searchTimer) {
                clearTimeout(searchTimer);
            }
            // 延迟500ms后搜索
            searchTimer = setTimeout(function() {
                searchFromBackend(keyword);
            }, 500);
        });

    });
</script>
</html>
