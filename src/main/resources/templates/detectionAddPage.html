<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WebSql-检测任务新增</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/static/img/favicon.ico}" media="screen"/>
    <link rel="stylesheet" th:href="@{/static/css/layui.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/static/code/codemirror.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/static/code/show-hint.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/static/css/sqlPage.css}" media="all">
    <style>
        /* 统一工具条内所有控件高度：原 sqlPage.css 让 select=30px，而普通 input=38px，导致高低不齐 */
        #menu-id .layui-input,
        #menu-id .layui-form-select .layui-input {
            height: 30px;
            line-height: 30px;
        }

        /* 工具栏内去掉 layui 默认的 input-inline 外边距，改用 gap 控制间距更整齐 */
        .dt-bar .layui-input-inline {
            margin: 0;
        }

        /* 缩小下拉框宽度 */
        .dt-bar .layui-input-inline.layui-select-sm {
            width: 170px;
        }

        /* 状态 / 紧急类型 选项短，进一步收窄 */
        .dt-bar .layui-input-inline.layui-select-sm.short {
            width: 120px;
        }

        /* 任务名称输入框收窄 */
        .dt-bar .layui-input-inline.narrow {
            width: 150px;
        }
    </style>
</head>
<body>
<div class="card" id="menu-id" style="padding: 0;">
    <form class="layui-form">
        <!-- 工具栏：所有控件 + 按钮，与 SQL 页面同构（按钮必须在 .button-row 内才能正常渲染） -->
        <div class="layui-form-item button-row dt-bar" style="margin: 0; padding: 10px 12px; background: #fafbfc; flex-wrap: wrap; gap: 14px; align-items: center; border-radius: 8px 8px 0 0;">
            <!-- 1. 数据源选择 -->
            <div class="layui-input-inline layui-select-sm">
                <select name="dataBaseName" id="dataBaseName" lay-filter="dataBaseName" lay-search="" lay-affix="clear"></select>
            </div>

            <!-- 2. 任务名称 -->
            <div class="layui-input-inline narrow">
                <input type="text" id="name" name="name" class="layui-input" lay-affix="clear" placeholder="任务名称"/>
            </div>

            <!-- 3. 表达式 -->
            <div class="layui-input-inline">
                <input type="text" id="cron" name="cron" class="layui-input" value="" lay-affix="clear" placeholder="定时表达式"/>
            </div>

            <!-- 4. 结果列名 -->
            <div class="layui-input-inline">
                <input type="text" id="columnName" name="columnName" class="layui-input" lay-affix="clear" placeholder="结果值列名"/>
            </div>

            <!-- 5. 计算表达式 -->
            <div class="layui-input-inline">
                <input type="text" name="expression" id="expression" class="layui-input" placeholder="计算结果表达式" lay-affix="clear"/>
            </div>

            <!-- 6. 紧急类型 -->
            <div class="layui-input-inline layui-select-sm short">
                <select name="alarmLevel" lay-search="">
                    <option value="普通">普通</option>
                    <option value="紧急">紧急</option>
                </select>
            </div>

            <!-- 7. 告警模板 -->
            <div class="layui-input-inline layui-select-sm">
                <select name="messageTemplate" id="messageTemplate" lay-filter="messageTemplate" lay-search="" lay-affix="clear"></select>
            </div>

            <!-- 8. 状态 -->
            <div class="layui-input-inline layui-select-sm short">
                <select name="state" lay-search="">
                    <option value="开始监控">开始监控</option>
                    <option value="停止监控">停止监控</option>
                </select>
            </div>

            <button class="layui-btn layui-btn-primary layui-btn-sm layui-border-green" lay-submit lay-filter="save">
                <i class="layui-icon layui-icon-add-circle"></i> 保存
            </button>

            <i class="layui-icon layui-icon-tips" id="dt-help" title="填写说明"
               style="margin-left: 10px; cursor: pointer; color: #16baaa; font-size: 16px;"></i>
        </div>
    </form>
    <textarea id='sqlText' style="width: 99%;height: 500px;align-content: center;"></textarea>
</div>

<script th:src="@{/static/layui.js}"></script>
<script th:replace="~{base::ctx}"></script>
<script th:src="@{/static/lay-config.js}"></script>
<script th:src="@{/static/code/codemirror.js}"></script>
<script th:src="@{/static/code/matchbrackets.js}"></script>
<script th:src="@{/static/code/sql.js}"></script>
<script th:src="@{/static/code/show-hint.js}"></script>
<script th:src="@{/static/code/sql-hint.js}"></script>
<script th:src="@{/static/code/sql-formatter.min.cjs}"></script>
<script th:src="@{/static/code/placeholder.js}"></script>
<script th:src="@{/static/base64.min.js}"></script>
<script>
    layui.use(['jquery', 'layer', 'form', 'laySelect'], function () {
        const layer = layui.layer;
        const form = layui.form;
        const $ = layui.jquery;
        const select = layui.laySelect;

        const editor = CodeMirror.fromTextArea(document.getElementById("sqlText"), {
            mode: {
                name: "text/x-plsql"
            },
            matchBrackets: true,
            styleActiveLine: true,
            indentWithTabs: true,
            smartIndent: true,
            lineNumbers: true,
            spellcheck: true,
            lineWrapping: true,
            resetSelectionOnContextMenu: true,
            extraKeys: {
                'Ctrl': 'autocomplete',
                Tab: function (cm) {
                    let spaces = Array(cm.getOption('indentUnit') + 1).join(' ');
                    cm.replaceSelection(spaces);
                }
            },
            hintOptions: {completeSingle: false}
        });
        editor.setSize(null, 500);
        editor.getWrapperElement().style.fontSize = '14px';
        editor.on('keypress', () => {
            editor.showHint();
        });

        editor.focus();

        //填写说明：点击问号图标，逐字段展示提示（一行一个）
        $('#dt-help').on('click', function () {
            const html = [
                '<div style="line-height: 24px; padding: 2px 2px;">',
                '<div><b>数据源</b>：要执行检测任务的数据源</div>',
                '<div><b>任务名称</b>：检测任务名称</div>',
                '<div><b>表达式</b>：定时执行表达式，如 0/30 * * * * ?（每30秒执行一次）</div>',
                '<div><b>结果列名</b>：SQL 查询结果集中的列名，用于取值计算，如 result</div>',
                '<div><b>计算表达式</b>：计算表达式，如 result-2&gt;0（结果列减2大于0则告警）</div>',
                '<div><b>紧急类型</b>：告警紧急程度</div>',
                '<div><b>告警模板</b>：告警模板，配置：系统管理-参数设置-告警模板</div>',
                '<div><b>状态</b>：监控状态（开始/停止）</div>',
                '<div><b>SQL内容</b>：查询语句,如select amount as result from order </div>',
                '<div><b>wiki</b>：<a  href="https://gitee.com/boy_0214/websql/wikis/pages?sort_id=16605240&doc_id=3405209" target="_blank" style="color: blue">Gitee Wiki</a></div>',
                '</div>'
            ].join('');
            layer.open({
                type: 0,
                title: '字段填写说明',
                content: html,
                shade: 0,
                btn: ['知道了'],
                area: ['460px', 'auto']
            });
        });

        let activeDataSource;
        select.render({
            elem: "#dataBaseName",
            url: ctx + 'dataSourceManager/findDataSourceList',
            select: 10000,
            title: '请选择数据源',
            format: function (data) {
                return parseSelectData(data);
            },
            success: function (data, activeData) {
                activeDataSource = activeData.length === 0 ? null : activeData[0].code;
                editorHintSettings();
            },
            onselect: function (data) {
                activeDataSource = data;
                editorHintSettings();
            }
        });

        let activeMessageTemplate;
        select.render({
            elem: "#messageTemplate",
            url: ctx + 'settingManager/findMessageTemplateList',
            select: 10000,
            title: '请选择告警模板',
            format: function (data) {
                return parseSelectData(data);
            },
            success: function (data, activeData) {
                activeMessageTemplate = activeData.length === 0 ? null : activeData[0].code;
            },
            onselect: function (data) {
                activeMessageTemplate = data;
            }
        });


        function editorHintSettings() {
            if (activeDataSource === "" || activeDataSource == null) {
                return false;
            }
            post(ctx + "sqlManager/findTableField?database=" + activeDataSource, null, (res) => {
                if (res.code !== 200 || res.data === null) {
                    console.error("获取表名及字段失败,无法提供编辑器提示功能!" + res.msg);
                    return false;
                }
                editor.setOption('hintOptions', {
                    completeSingle: false,
                    tables: res.data
                });
            });
        }

        form.on('submit(save)', function (data) {
            let sqlContent = editor.getValue().trim();
            if (sqlContent === "" || sqlContent == null) {
                layer.msg("SQL语句为空，无需保存哦~", {icon: 2});
                return false;
            }
            if (activeDataSource === "" || activeDataSource == null) {
                layer.msg("请选择数据源~", {icon: 2});
                return false;
            }
            data.field.sqlContent = Base64.encode(sqlContent);
            data.field.dataBaseName = activeDataSource;
            data.field.messageId = activeMessageTemplate === "" ? null : activeMessageTemplate;
            post(ctx + "detectionManager/add", data.field, (res) => {
                layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2}, () => {
                    if (res.code === 200) location.reload();
                });
            });
            return false;
        });
    });
</script>
</body>
</html>
