<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>数据开发</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/static/img/favicon.ico}" media="screen"/>
    <link rel="stylesheet" th:href="@{/static/css/layui.css}" media="all"/>
    <style>
        /* 自定义小尺寸导航 */
        .layui-nav-small .layui-nav-item {
            height: 35px !important;
            line-height: 35px !important;
            margin: 0 5px;
        }

        .layui-nav-small .layui-nav-item a {
            padding: 0 10px !important;
            height: 35px !important;
            line-height: 35px !important;
            font-size: 16px !important;
        }

        /* 图标样式调整 */
        .layui-nav-small .layui-icon {
            font-size: 18px !important;
        }

        /* 移除选中效果 */
        .layui-nav-small layui-this {
            background-color: transparent !important;
        }

        .monaco-wrapper {
            width: 99%;
            height: calc(100vh - 50px);
        }

        #monaco-editor {
            width: 100%;
            height: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* 卡片风格多选组件 */
        .layui-form-checkbox > .lay-skin-checkcard,
        .layui-form-radio > .lay-skin-checkcard {
            display: flex;
            padding: 12px;
            white-space: normal;
            border-radius: 10px;
            border: 1px solid #e5e5e5;
            color: #000;
            background-color: #fff;
        }

        .layui-form-checkbox > .lay-skin-checkcard > *,
        .layui-form-radio > .lay-skin-checkcard > * {
            vertical-align: top;
        }

        .layui-form-checkbox:hover > .lay-skin-checkcard,
        .layui-form-radio:hover > .lay-skin-checkcard {
            border-color: #16b777;
        }

        .layui-form-checked > .lay-skin-checkcard,
        .layui-form-radioed[lay-skin="none"] > .lay-skin-checkcard {
            color: #000;
            border-color: #16b777;
            background-color: rgb(22 183 119 / 10%) !important;
        }

        .layui-checkbox-disabled > .lay-skin-checkcard,
        .layui-radio-disabled > .lay-skin-checkcard {
            box-shadow: none;
            border-color: #e5e5e5 !important;
            background-color: #eee !important;
        }

        .lay-skin-checkcard-avatar {
            padding-right: 8px;
        }

        .lay-skin-checkcard-detail {
            overflow: hidden;
            width: 100%;
        }

        .lay-skin-checkcard-header {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            margin-bottom: 4px;
        }

        .lay-skin-checkcard-description {
            font-size: 13px;
            color: #5f5f5f;
        }

        .layui-disabled .lay-skin-checkcard-description {
            color: #c2c2c2 !important;
        }

        .layui-form-checked > .lay-check-dot:after,
        .layui-form-radioed > .lay-check-dot:after {
            position: absolute;
            content: "";
            top: 2px;
            right: 2px;
            width: 0;
            height: 0;
            display: inline-block;
            vertical-align: middle;
            border-width: 10px;
            border-style: dashed;
            border-color: transparent;
            border-top-left-radius: 0;
            border-top-right-radius: 6px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 6px;
            border-top-color: #16b777;
            border-top-style: solid;
            border-right-color: #16b777;
            border-right-style: solid;
            overflow: hidden;
        }

        .layui-checkbox-disabled > .lay-check-dot:after,
        .layui-radio-disabled > .lay-check-dot:after {
            border-top-color: #d2d2d2;
            border-right-color: #d2d2d2;
        }

        .layui-form-checked > .lay-check-dot-2:before,
        .layui-form-radioed > .lay-check-dot-2:before {
            position: absolute;
            font-family: "layui-icon";
            content: "\e605";
            color: #fff;
            bottom: 4px;
            right: 3px;
            font-size: 9px;
            z-index: 12;
        }

        .layui-form-checked > .lay-check-dot-2:after,
        .layui-form-radioed > .lay-check-dot-2:after {
            position: absolute;
            content: "";
            bottom: 2px;
            right: 2px;
            width: 0;
            height: 0;
            display: inline-block;
            vertical-align: middle;
            border-width: 10px;
            border-style: dashed;
            border-color: transparent;
            border-top-left-radius: 6px;
            border-top-right-radius: 0;
            border-bottom-right-radius: 6px;
            border-bottom-left-radius: 0;
            border-right-color: #16b777;
            border-right-style: solid;
            border-bottom-color: #16b777;
            border-bottom-style: solid;
            overflow: hidden;
        }

        .layui-checkbox-disabled > .lay-check-dot-2:before,
        .layui-radio-disabled > .lay-check-dot-2:before {
            color: #eee !important;
        }

        .layui-checkbox-disabled > .lay-check-dot-2:after,
        .layui-radio-disabled > .lay-check-dot-2:after {
            border-bottom-color: #d2d2d2;
            border-right-color: #d2d2d2;
        }

        .lay-ellipsis-multi-line {
            overflow: hidden;
            word-break: break-all;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
        }
    </style>
</head>
<body>
<div class="layui-card-header" style="padding:0">
    <ul class="layui-nav layui-bg-gray layui-nav-small" lay-filter="left-icons">
        <li class="layui-nav-item"><a href="javascript:;" title="运行" class="layui-icon layui-icon-play"></a></li>
        <li class="layui-nav-item"><a href="javascript:;" title="保存SQL" class="layui-icon layui-icon-file"></a></li>
        <li class="layui-nav-item"><a href="javascript:;" title="格式化" class="layui-icon layui-icon-fonts-code"></a></li>
        <li class="layui-nav-item"><a href="javascript:;" title="发布任务" class="layui-icon layui-icon-release"></a></li>
        <li class="layui-nav-item"><a href="javascript:;" title="下载" class="layui-icon layui-icon-download-circle"></a></li>
        <li class="layui-nav-item"><a href="javascript:;" title="任务实例" class="layui-icon layui-icon-chart-screen"></a></li>
        <li class="layui-nav-item"><a href="javascript:;" title="参照模板" class="layui-icon layui-icon-template"></a></li>
        <li class="layui-nav-item"><a href="javascript:;" title="帮助" class="layui-icon layui-icon-about"></a></li>
        <li class="layui-nav-item">
            <a href="javascript:;" title="修改任务" class="layui-icon layui-icon-edit" id="viewTaskName"></a>
        </li>
    </ul>
</div>
<div>
    <div class="monaco-wrapper">
        <div id="monaco-editor"></div>
    </div>
</div>

<!-- 保存弹窗 -->
<div id="save-layer-wrapper" style="display: none;">
    <div style="padding:10px;">
        <form class="layui-form" action="" id="typeForm">
            <!-- 类型 -->
            <div class="layui-row layui-col-space8" id="tabsHeader">
                <div class="layui-col-xs12 layui-col-sm6 layui-col-md3">
                    <input type="radio" name="viewType" value="addSql" lay-skin="none" checked lay-filter="viewType">
                    <div lay-radio class="lay-skin-checkcard lay-check-dot-2" style="height: 80px">
                        <div class="lay-skin-checkcard-avatar">
                            <i class="layui-icon layui-icon-add-1" style="font-size: 30px"></i>
                        </div>
                        <div class="lay-skin-checkcard-detail">
                            <div class="lay-skin-checkcard-header">新建</div>
                            <div class="lay-skin-checkcard-description lay-ellipsis-multi-line">
                                SQL脚本类型任务
                            </div>
                        </div>
                    </div>
                </div>

                <div class="layui-col-xs12 layui-col-sm6 layui-col-md3">
                    <input type="radio" name="viewType" value="update" lay-skin="none" lay-filter="viewType">
                    <div lay-radio class="lay-skin-checkcard lay-check-dot-2" style="height: 80px">
                        <div class="lay-skin-checkcard-avatar">
                            <span class="layui-icon layui-icon-edit" style="font-size: 30px"></span>
                        </div>
                        <div class="lay-skin-checkcard-detail">
                            <div class="lay-skin-checkcard-header">修改</div>
                            <div class="lay-skin-checkcard-description lay-ellipsis-multi-line">
                                SQL脚本类型任务
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-col-xs12 layui-col-sm6 layui-col-md3">
                    <input type="radio" name="viewType" value="addEtl" lay-skin="none" disabled lay-filter="viewType">
                    <div lay-radio class="lay-skin-checkcard lay-check-dot-2" style="height: 80px">
                        <div class="lay-skin-checkcard-avatar">
                            <i class="layui-icon layui-icon-table" style="font-size: 30px"></i>
                        </div>
                        <div class="lay-skin-checkcard-detail">
                            <div class="lay-skin-checkcard-header">新建</div>
                            <div class="lay-skin-checkcard-description lay-ellipsis-multi-line">
                                ETL可视化类型任务
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-col-xs12 layui-col-sm6 layui-col-md3">
                    <input type="radio" name="viewType" value="addRefer" lay-skin="none" lay-filter="viewType">
                    <div lay-radio class="lay-skin-checkcard lay-check-dot-2" style="height: 80px">
                        <div class="lay-skin-checkcard-avatar">
                            <i class="layui-icon layui-icon-star-fill" style="font-size: 30px"></i>
                        </div>
                        <div class="lay-skin-checkcard-detail">
                            <div class="lay-skin-checkcard-header">示例</div>
                            <div class="lay-skin-checkcard-description lay-ellipsis-multi-line">
                                数据宽表处理示例
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <!-- 新增 -->
        <div id="addView" style="display: none;">
            <form class="layui-form" action="" id="addForm">
                <input type="hidden" name="id" id="updateId"/>
                <hr class="layui-border-green">
                <div class="layui-form-item">
                    <label class="layui-form-label">任务名称</label>
                    <div class="layui-input-inline" style="width: 50%;">
                        <input type="text" name="taskName" id="taskName" lay-verify="required" autocomplete="off"
                               placeholder="请输入任务名称" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">定时任务</label>
                    <div class="layui-input-inline" style="width: 50%;">
                        <input type="text" name="cron" id="cron" lay-verify="required" autocomplete="off"
                               lay-affix="clear" placeholder="请输入cron表达式" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">任务描述</label>
                    <div class="layui-input-block" style="width: 75%;">
                    <textarea name="description" id="description" placeholder="请输入任务描述"
                              class="layui-textarea"></textarea>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">任务状态</label>
                    <div class="layui-input-inline" style="width: 40%;">
                        <input type="text" name="status" id="status"  value="草稿" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">任务类型</label>
                    <div class="layui-input-inline" style="width: 50%;">
                        <input type="text" name="taskType" id="taskType" lay-verify="required" autocomplete="off"
                               value="SQL任务" readonly placeholder="SQL任务" class="layui-input">
                    </div>
                </div>

                <div class="page-footer">
                    <div class="btn-list">
                        <div class="btnlist">
                            <button class="layui-btn layui-btn-primary layui-border-green layui-btn-sm" lay-submit
                                    lay-filter="save">
                                <i class="layui-icon layui-icon-ok">&nbsp;</i>保存
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- 修改 -->
        <div id="updateView" style="display: none;">
            <hr class="layui-border-green">
            <form class="layui-form" action="" id="updateForm">
                <div class="layui-form-item">
                    <select name="taskOption" id="taskOption" lay-filter="taskOption" lay-search=""
                            lay-affix="clear"></select>
                </div>
                <div class="page-footer">
                    <div class="btn-list">
                        <div class="btnlist">
                            <button class="layui-btn layui-btn-primary layui-border-green layui-btn-sm" lay-submit
                                    lay-filter="update">
                                <i class="layui-icon layui-icon-ok">&nbsp;</i>开始编辑
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- 示例 -->
        <div id="addReferView" style="display: none;">
            <hr class="layui-border-green">
            <div class="layui-form-item">
                Mysql & Postgres IN Doris
            </div>
        </div>
    </div>
</div>

<script th:src="@{/static/code/sql-formatter.min.cjs}"></script>
<script th:src="@{/static/monaco/min/vs/loader.js}"></script>
<script th:src="@{/static/layui.js}"></script>
<script th:src="@{/static/lay-config.js}"></script>
<script th:replace="~{base::ctx}"></script>
<script type="text/javascript" th:inline="javascript" th:fragment="ctx">

    layui.use(['element', 'layer', 'form', 'laySelect'], function () {
        const layer = layui.layer;
        const form = layui.form;
        const $ = layui.$;
        const select = layui.laySelect;

        // 应用状态管理
        const appState = {
            hasUnsavedChanges: false,
            taskId: null,
            taskName: null,
            editor: null,
            userName:null
        };

        // 初始化应用状态
        function initAppState() {
            appState.taskId = [[${data.id != null ? data.id : ''}]];
            appState.taskName = [[${data.taskName != null ? data.taskName : ''}]];
            appState.cron = [[${data.cron != null ? data.cron : ''}]];
            appState.sqlContent = [[${data.sqlContent != null ? data.sqlContent : ''}]];
            appState.userName = [[${userName != null ? userName : ''}]];

            $('#taskId').val(appState.taskId);
            // 设置视图显示
            $('#viewTaskName').html(appState.taskName || '未命名任务');
            // 默认显示新增视图
            $('#addView').show();
        }

        // 页面切换处理
        form.on('radio(viewType)', function(data) {
            const views = {
                addSql: '#addView',
                update: '#updateView',
                addRefer: '#addReferView'
            };

            Object.values(views).forEach(id => $(id).hide());
            $(views[data.value]).show();
        });

        // 保存任务
        form.on('submit(save)', function(data) {
            const formData = {
                ...data.field,
                taskId: appState.taskId,
                sqlContent: appState.editor?.getValue() || ''
            };
            post(ctx + "bigdataManager/saveTask", formData, (res) => {
                if (res.code === 200) {
                    appState.hasUnsavedChanges = false;
                    appState.taskId = res.data.id;
                    appState.taskName = res.data.taskName;

                    $('#hiddenTaskName').val(appState.taskName);
                    $('#viewTaskName').html(appState.taskName);
                    $('#taskId').val(appState.taskId);
                }

                layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2}, () => {
                    if (res.code === 200) layer.closeAll();
                });
            });
            return false;
        });

        // 加载任务列表
        function loadTaskOptions() {
            select.render({
                elem: "#taskOption",
                url: ctx + 'bigdataManager/findDataList',
                select: 10000,
                title: '请选择要修改的任务',
                format: parseSelectData,
                success: (data) => {},
                onselect: (data) => { appState.taskId = data.id; }
            });
        }


        // 更新任务
        form.on('submit(update)', function(data) {
            const selectedTaskId = $("#taskOption").val();
            if (!selectedTaskId) {
                layer.msg('请选择要修改的任务', {icon: 2});
                return false;
            }
            appState.taskId = selectedTaskId;
            appState.hasUnsavedChanges = false;
            location.href = `${ctx}bigdataManager/dataDevPage?id=${appState.taskId}`;
            return false;
        });

        // 初始化Monaco编辑器
        function initMonacoEditor() {
            require.config({ paths: { 'vs': '/static/monaco/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                const defaultValue =
`--********************************************************************--
-- comment:
-- author: ${appState.userName}
-- date: ${new Date().toLocaleString()}
--********************************************************************--\n`;

                const initialValue = appState.sqlContent || defaultValue;

                appState.editor = monaco.editor.create(
                    document.getElementById('monaco-editor'),
                    {
                        value: initialValue,
                        language: 'sql',
                        theme: 'vs-light',
                        fontSize: 14,
                        automaticLayout: true,
                        minimap: { enabled: true, side: 'right', size: 'fill' },
                        scrollbar: { vertical: 'auto', horizontal: 'auto' }
                    }
                );

                appState.editor.getModel().onDidChangeContent(() => {
                    appState.hasUnsavedChanges = appState.editor.getValue().trim() !== '';
                });
            });
        }

        // 工具栏操作处理
        function setupToolbarActions() {
            $('.layui-nav-small .layui-nav-item a').on('click', function(e) {
                $('.layui-nav-small .layui-nav-item').removeClass('layui-this');
                const title = $(this).attr('title');
                const actions = {
                    '运行': executeSQL,
                    '保存SQL': saveData,
                    '格式化': formatSQL,
                    '修改任务': showUpdateTaskPage,
                    '发布任务': () => layer.msg('任务管理功能开发中...'),
                    '下载': downloadSQL,
                    '任务实例': () => layer.msg('任务管理功能开发中...'),
                    '参照模板': () => layer.msg('模板功能开发中...'),
                    '帮助': showHelp
                };

                if (actions[title]) actions[title]();
            });
        }

        // SQL格式化
        function formatSQL() {
            if (!appState.editor) {
                layer.msg('编辑器未初始化');
                return;
            }

            try {
                const formatted = window.sqlFormatter.format(
                    appState.editor.getValue(),
                    { language: 'sql', indent: '    ', uppercase: true, linesBetweenQueries: 2 }
                );
                appState.editor.setValue(formatted);
            } catch (error) {
                console.error('格式化失败:', error);
                layer.msg('SQL格式化失败', {icon: 2});
            }
        }

        // 显示帮助
        function showHelp() {
            const helpConfig = helpToolbarConfig('https://gitee.com/boy_0214/websql/wikis/pages?sort_id=16922011&doc_id=3405209');
            helpConfig.onClick();
        }

        // 下载SQL
        function downloadSQL() {
            if (!appState.editor) return;

            const blob = new Blob([appState.editor.getValue()], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');

            a.href = url;
            a.download = `sql_${appState.taskName || 'script'}_${Date.now()}.sql`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            layer.msg('下载成功');
        }

        // 保存数据
        function saveData() {
            if (!appState.editor) return;
            const formData = {
                id: appState.taskId,
                sqlContent: appState.editor.getValue()
            };
            post(ctx + "bigdataManager/saveTaskContent", formData, (res) => {
                if (res.code === 200) {
                    appState.hasUnsavedChanges = false;
                    appState.taskId = res.data.id;
                    $('#taskId').val(res.data.id);
                } else {
                    layer.msg(res.msg || '保存失败', {icon: 2});
                }
            });
        }

        // 显示保存页面
        function showSavePage() {
            if (!appState.taskId) {
                $("#typeForm").show();
                $("#taskName").val(appState.taskName);
                $("#taskId").val(appState.taskId);
                layer.open({
                    type: 1,
                    area: ['800px', '600px'],
                    title: '数据开发',
                    shade: 0.6,
                    shadeClose: false,
                    maxmin: false,
                    closeBtn:0,
                    anim: 0,
                    content: $('#save-layer-wrapper')
                });
            }
        }

        // 显示更新任务页面
        function showUpdateTaskPage(){
            if (appState.taskId) {
                //隐藏固定新增视图
                $("#typeForm").hide();
                $('#addView').show();
                post(ctx + "bigdataManager/getTask/"+appState.taskId, null, (res) => {
                    if (res.code === 200) {
                        const data = res.data;
                        $('#description').val(data.description);
                        $('#updateId').val(data.id);
                        $('#cron').val(data.cron);
                        $('#taskName').val(data.taskName).attr("readonly", true);
                        $('#status').val(data.status).attr("readonly", true);
                        layer.open({
                        type: 1,
                        area: ['800px', '500px'],
                        title: '修改任务配置',
                        shade: 0.6,
                        anim: 0,
                        content: $('#save-layer-wrapper')
                    })
                    }
                });
            }
        }

        function executeSQL() {
            if (!appState.editor) return;
            const formData = {
                id: appState.taskId,
                sqlContent: appState.editor.getValue()
            };
            post(ctx + "bigdataManager/execute", formData, (res) => {
                if (res.code === 200) {
                    layer.msg(res.data);
                    layer.closeAll();
                } else {
                    layer.msg(res.msg || '保存失败', {icon: 2});
                }
            });
        }


        // 初始化应用
        function initApp() {
            initAppState();
            loadTaskOptions();
            initMonacoEditor();
            setupToolbarActions();
            showSavePage();

            // 未保存更改提示
            window.addEventListener('beforeunload', (e) => {
                if (appState.hasUnsavedChanges) {
                    e.preventDefault();
                    e.returnValue = '您修改的内容未保存，确定要离开吗？';
                    return e.returnValue;
                }
            });
        }

        // 启动应用
        initApp();
    });
</script>
</body>
</html>
