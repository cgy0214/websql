<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>数据开发</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/static/img/favicon.ico}" media="screen"/>
    <link rel="stylesheet" th:href="@{/static/css/layui.css}" media="all"/>
    <link rel="stylesheet" th:href="@{/static/css/sqlPage.css}" media="all">
    <style>
        /* 自定义小尺寸导航 */
        .layui-nav-small .layui-nav-item {
            height: 35px !important;
            line-height: 35px !important;
            margin: 0 5px;
        }

        .layui-nav-small .layui-nav-item a {
            padding: 0 10px !important;
            height: 35px !important;
            line-height: 35px !important;
            font-size: 16px !important;
        }

        /* 图标样式调整 */
        .layui-nav-small .layui-icon {
            font-size: 18px !important;
        }

        /* 移除选中效果 */
        .layui-nav-small layui-this {
            background-color: transparent !important;
        }

        /* 主容器，使用 flex 布局 */
        .main-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px); /* 减去顶部导航栏高度 */
            width: 100%;
            overflow: hidden;
        }

        .monaco-wrapper {
            flex: 1; /* 自动占据剩余空间 */
            width: 100%;
            position: relative;
            transition: height 0.3s ease; /* 添加平滑过渡动画 */
        }

        #monaco-editor {
            width: 100%;
            height: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* 结果区域容器 */
        #result-container {
            height: 350px; /* 固定高度 */
            background-color: #fff;
            border-top: 1px solid #ddd;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            display: none; /* 默认隐藏 */
            flex-direction: column;
            position: relative;
            transition: height 0.3s ease;
        }
        
        /* 结果区域标题栏 */
        .result-header {
            height: 32px;
            line-height: 32px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #eee;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .result-title {
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }
        
        .result-tools {
            display: flex;
            align-items: center;
        }
        
        .result-close-btn {
            cursor: pointer;
            padding: 0 5px;
            color: #666;
        }
        
        .result-close-btn:hover {
            color: #ff5722;
        }

        /* 消息区域 */
        #msgDiv {
            padding: 10px;
            overflow-y: auto;
            max-height: 100px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        /* 表格区域 */
        #sqlTableDiv {
            flex: 1;
            overflow: hidden;
            padding: 5px;
        }

        /* 卡片风格多选组件 (保持原有样式) */
        .layui-form-checkbox > .lay-skin-checkcard,
        .layui-form-radio > .lay-skin-checkcard {
            display: flex;
            padding: 12px;
            white-space: normal;
            border-radius: 10px;
            border: 1px solid #e5e5e5;
            color: #000;
            background-color: #fff;
        }
        /* ... 其他原有样式 ... */


        .layui-form-checkbox > .lay-skin-checkcard > *,
        .layui-form-radio > .lay-skin-checkcard > * {
            vertical-align: top;
        }

        .layui-form-checkbox:hover > .lay-skin-checkcard,
        .layui-form-radio:hover > .lay-skin-checkcard {
            border-color: #16b777;
        }

        .layui-form-checked > .lay-skin-checkcard,
        .layui-form-radioed[lay-skin="none"] > .lay-skin-checkcard {
            color: #000;
            border-color: #16b777;
            background-color: rgb(22 183 119 / 10%) !important;
        }

        .layui-checkbox-disabled > .lay-skin-checkcard,
        .layui-radio-disabled > .lay-skin-checkcard {
            box-shadow: none;
            border-color: #e5e5e5 !important;
            background-color: #eee !important;
        }

        .lay-skin-checkcard-avatar {
            padding-right: 8px;
        }

        .lay-skin-checkcard-detail {
            overflow: hidden;
            width: 100%;
        }

        .lay-skin-checkcard-header {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            margin-bottom: 4px;
        }

        .lay-skin-checkcard-description {
            font-size: 13px;
            color: #5f5f5f;
        }

        .layui-disabled .lay-skin-checkcard-description {
            color: #c2c2c2 !important;
        }

        .layui-form-checked > .lay-check-dot:after,
        .layui-form-radioed > .lay-check-dot:after {
            position: absolute;
            content: "";
            top: 2px;
            right: 2px;
            width: 0;
            height: 0;
            display: inline-block;
            vertical-align: middle;
            border-width: 10px;
            border-style: dashed;
            border-color: transparent;
            border-top-left-radius: 0;
            border-top-right-radius: 6px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 6px;
            border-top-color: #16b777;
            border-top-style: solid;
            border-right-color: #16b777;
            border-right-style: solid;
            overflow: hidden;
        }

        .layui-checkbox-disabled > .lay-check-dot:after,
        .layui-radio-disabled > .lay-check-dot:after {
            border-top-color: #d2d2d2;
            border-right-color: #d2d2d2;
        }

        .layui-form-checked > .lay-check-dot-2:before,
        .layui-form-radioed > .lay-check-dot-2:before {
            position: absolute;
            font-family: "layui-icon";
            content: "\e605";
            color: #fff;
            bottom: 4px;
            right: 3px;
            font-size: 9px;
            z-index: 12;
        }

        .layui-form-checked > .lay-check-dot-2:after,
        .layui-form-radioed > .lay-check-dot-2:after {
            position: absolute;
            content: "";
            bottom: 2px;
            right: 2px;
            width: 0;
            height: 0;
            display: inline-block;
            vertical-align: middle;
            border-width: 10px;
            border-style: dashed;
            border-color: transparent;
            border-top-left-radius: 6px;
            border-top-right-radius: 0;
            border-bottom-right-radius: 6px;
            border-bottom-left-radius: 0;
            border-right-color: #16b777;
            border-right-style: solid;
            border-bottom-color: #16b777;
            border-bottom-style: solid;
            overflow: hidden;
        }

        .layui-checkbox-disabled > .lay-check-dot-2:before,
        .layui-radio-disabled > .lay-check-dot-2:before {
            color: #eee !important;
        }

        .layui-checkbox-disabled > .lay-check-dot-2:after,
        .layui-radio-disabled > .lay-check-dot-2:after {
            border-bottom-color: #d2d2d2;
            border-right-color: #d2d2d2;
        }

        .lay-ellipsis-multi-line {
            overflow: hidden;
            word-break: break-all;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
        }
    </style>
</head>

    <div style="padding:10px;">

                        <div class="lay-skin-checkcard-detail">

<script th:src="@{/static/code/sql-formatter.min.cjs}"></script>
<script th:src="@{/static/monaco/min/vs/loader.js}"></script>
<script th:src="@{/static/layui.js}"></script>
<script th:src="@{/static/lay-config.js}"></script>
<script th:replace="~{base::ctx}"></script>
<script type="text/javascript" th:inline="javascript" th:fragment="ctx">

    layui.use(['element', 'layer', 'form', 'laySelect', 'table', 'dropdown', 'laytpl'], function () {
        const layer = layui.layer;
        const form = layui.form;
        const $ = layui.$;
        const select = layui.laySelect;
        const table = layui.table;
        const dropdown = layui.dropdown;
        const laytpl = layui.laytpl;
        const element = layui.element;
        const viewStore = {
             get: function(key, def) { return localStorage.getItem(key) || def; },
             put: function(key, val) { localStorage.setItem(key, val); }
        };
        const tableSizeKey = "tableSize";

        // 应用状态管理
        const appState = {
            hasUnsavedChanges: false,
            taskId: null,
            taskName: null,
            editor: null,
            userName:null
        };

        // 初始化应用状态
        function initAppState() {
            appState.taskId = [[${data.id != null ? data.id : ''}]];
            appState.taskName = [[${data.taskName != null ? data.taskName : ''}]];
            appState.cron = [[${data.cron != null ? data.cron : ''}]];
            appState.sqlContent = [[${data.sqlContent != null ? data.sqlContent : ''}]];
            appState.userName = [[${userName != null ? userName : ''}]];

            $('#taskId').val(appState.taskId);
            // 设置视图显示
            $('#viewTaskName').html(appState.taskName || '未命名任务');
            // 默认显示新增视图
            $('#addView').show();
        }

        // 页面切换处理
        form.on('radio(viewType)', function(data) {
            const views = {
                addSql: '#addView',
                update: '#updateView',
                addRefer: '#addReferView'
            };

            Object.values(views).forEach(id => $(id).hide());
            $(views[data.value]).show();
        });

        // 保存任务
        form.on('submit(save)', function(data) {
            const formData = {
                ...data.field,
                taskId: appState.taskId,
                sqlContent: appState.editor?.getValue() || ''
            };
            post(ctx + "bigdataManager/saveTask", formData, (res) => {
                if (res.code === 200) {
                    appState.hasUnsavedChanges = false;
                    appState.taskId = res.data.id;
                    appState.taskName = res.data.taskName;

                    $('#hiddenTaskName').val(appState.taskName);
                    $('#viewTaskName').html(appState.taskName);
                    $('#taskId').val(appState.taskId);
                }

                layer.msg(res.msg, {icon: res.code === 200 ? 1 : 2}, () => {
                    if (res.code === 200) layer.closeAll();
                });
            });
            return false;
        });

        // 加载任务列表
        function loadTaskOptions() {
            select.render({
                elem: "#taskOption",
                url: ctx + 'bigdataManager/findDataList',
                select: 10000,
                title: '请选择要修改的任务',
                format: parseSelectData,
                success: (data) => {},
                onselect: (data) => { appState.taskId = data.id; }
            });
        }


        // 更新任务
        form.on('submit(update)', function(data) {
            const selectedTaskId = $("#taskOption").val();
            if (!selectedTaskId) {
                layer.msg('请选择要修改的任务', {icon: 2});
                return false;
            }
            appState.taskId = selectedTaskId;
            appState.hasUnsavedChanges = false;
            location.href = `${ctx}bigdataManager/dataDevPage?id=${appState.taskId}`;
            return false;
        });

        // 初始化Monaco编辑器
        function initMonacoEditor() {
            require.config({ paths: { 'vs': '/static/monaco/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                const defaultValue =
`--********************************************************************--
-- comment:
-- author: ${appState.userName}
-- date: ${new Date().toLocaleString()}
--********************************************************************--\n`;

                const initialValue = appState.sqlContent || defaultValue;

                appState.editor = monaco.editor.create(
                    document.getElementById('monaco-editor'),
                    {
                        value: initialValue,
                        language: 'sql',
                        theme: 'vs-light',
                        fontSize: 14,
                        automaticLayout: true,
                        minimap: { enabled: true, side: 'right', size: 'fill' },
                        scrollbar: { vertical: 'auto', horizontal: 'auto' }
                    }
                );

                appState.editor.getModel().onDidChangeContent(() => {
                    appState.hasUnsavedChanges = appState.editor.getValue().trim() !== '';
                });
            });
        }

        // 工具栏操作处理
        function setupToolbarActions() {
            $('.layui-nav-small .layui-nav-item a').on('click', function(e) {
                $('.layui-nav-small .layui-nav-item').removeClass('layui-this');
                const title = $(this).attr('title');
                const actions = {
                    '运行': executeSQL,
                    '保存SQL': saveData,
                    '格式化': formatSQL,
                    '修改任务': showUpdateTaskPage,
                    '发布任务': () => layer.msg('任务管理功能开发中...'),
                    '下载': downloadSQL,
                    '任务实例': () => layer.msg('任务管理功能开发中...'),
                    '参照模板': () => layer.msg('模板功能开发中...'),
                    '帮助': showHelp
                };

                if (actions[title]) actions[title]();
            });
        }

        // SQL格式化
        function formatSQL() {
            if (!appState.editor) {
                layer.msg('编辑器未初始化');
                return;
            }

            try {
                const formatted = window.sqlFormatter.format(
                    appState.editor.getValue(),
                    { language: 'sql', indent: '    ', uppercase: true, linesBetweenQueries: 2 }
                );
                appState.editor.setValue(formatted);
            } catch (error) {
                console.error('格式化失败:', error);
                layer.msg('SQL格式化失败', {icon: 2});
            }
        }

        // 显示帮助
        function showHelp() {
            const helpConfig = helpToolbarConfig('https://gitee.com/boy_0214/websql/wikis/pages?sort_id=16922011&doc_id=3405209');
            helpConfig.onClick();
        }

        // 下载SQL
        function downloadSQL() {
            if (!appState.editor) return;

            const blob = new Blob([appState.editor.getValue()], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');

            a.href = url;
            a.download = `sql_${appState.taskName || 'script'}_${Date.now()}.sql`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            layer.msg('下载成功');
        }

        // 保存数据
        function saveData() {
            if (!appState.editor) return;
            const formData = {
                id: appState.taskId,
                sqlContent: appState.editor.getValue()
            };
            post(ctx + "bigdataManager/saveTaskContent", formData, (res) => {
                if (res.code === 200) {
                    appState.hasUnsavedChanges = false;
                    appState.taskId = res.data.id;
                    $('#taskId').val(res.data.id);
                } else {
                    layer.msg(res.msg || '保存失败', {icon: 2});
                }
            });
        }

        // 显示保存页面
        function showSavePage() {
            if (!appState.taskId) {
                $("#typeForm").show();
                $("#taskName").val(appState.taskName);
                $("#taskId").val(appState.taskId);
                layer.open({
                    type: 1,
                    area: ['800px', '600px'],
                    title: '数据开发',
                    shade: 0.6,
                    shadeClose: false,
                    maxmin: false,
                    closeBtn:0,
                    anim: 0,
                    content: $('#save-layer-wrapper')
                });
            }
        }

        // 显示更新任务页面
        function showUpdateTaskPage(){
            if (appState.taskId) {
                //隐藏固定新增视图
                $("#typeForm").hide();
                $('#addView').show();
                post(ctx + "bigdataManager/getTask/"+appState.taskId, null, (res) => {
                    if (res.code === 200) {
                        const data = res.data;
                        $('#description').val(data.description);
                        $('#updateId').val(data.id);
                        $('#cron').val(data.cron);
                        $('#taskName').val(data.taskName).attr("readonly", true);
                        $('#status').val(data.status).attr("readonly", true);
                        layer.open({
                        type: 1,
                        area: ['800px', '500px'],
                        title: '修改任务配置',
                        shade: 0.6,
                        anim: 0,
                        content: $('#save-layer-wrapper')
                    })
                    }
                });
            }
        }

        function executeSQL() {
            if (!appState.editor) return;
            const formData = {
                id: appState.taskId,
                sqlContent: appState.editor.getValue()
            };
            
            let intervalTime = 0;
            let interval = setInterval(function () {
                intervalTime++;
                // message("执行耗时:" + intervalTime + "毫秒", true);
            }, 1);

            post(ctx + "bigdataManager/execute", formData, (res) => {
                window.clearInterval(interval);
                layer.closeAll();
                if (!res) {
                    layer.msg("结果返回未知异常！", {icon: 2});
                    return;
                }
                if (res.code === 200) {
                   tableInit(res.data);
                } else {
                    layer.msg(res.msg || '执行失败', {icon: 2});
                }
            });
        }
        
        let elementTabCount = [];
        function tableInit(data) {
            if (!data) return;
            
            // $('.monaco-wrapper').css('height', 'calc(100vh - 450px)');
            $('#result-container').css('display', 'flex');
            appState.editor.layout();

            for (let i = 0; i < elementTabCount.length; i++) {
                element.tabDelete('sqlTableTab', elementTabCount[i]);
            }
            $("#sqlTableDiv").hide();
            $("#msgDiv").hide();
            $("#msgSpan").html("");
            let index = 0;
            
            for (let i = 0; i < data.length; i++) {
                index++;
                let item = data[i];
                let statusMsg = "";
                
                if (item.type === 1) {
                     if (item.status === 2) {
                         statusMsg = "执行失败 " + item.errorMessage;
                     } else {
                         statusMsg = "执行成功影响【" + item.data + "】条数据!";
                     }
                } else if (item.data === null) {
                    statusMsg = item.status === 2 ? "执行失败 " + item.errorMessage : "执行成功返回为空!";
                } else if (item.status === 2) {
                     statusMsg = "执行失败 " + item.errorMessage;
                }
                
                if (statusMsg !== "") {
                    // let msg = "第[" + index + "]条SQL语句" + statusMsg + "<br>";
                    // $("#msgSpan").append(msg);
                    // $("#msgDiv").show();

                    let elId = "sqlMsg" + index;
                    elementTabCount.push(elId);
                    
                    let msgContent = `
                        <div style="padding: 20px; font-size: 14px; color: ${item.status === 2 ? '#FF5722' : '#009688'};">
                            <i class="layui-icon ${item.status === 2 ? 'layui-icon-close-fill' : 'layui-icon-ok-circle'}" style="font-size: 20px; vertical-align: middle;"></i>
                            <span style="vertical-align: middle; margin-left: 10px;">${statusMsg}</span>
                            <div style="margin-top: 10px; color: #666; font-family: monospace; background: #f8f8f8; padding: 10px; border-radius: 4px;">
                                SQL: ${item.sql || 'N/A'}
                            </div>
                        </div>
                    `;
                    
                    element.tabAdd('sqlTableTab', {
                        title: (item.status === 2 ? '❌ ' : '✅ ') + '结果 ' + index,
                        content: msgContent,
                        id: elId,
                        change: true
                    });
                    
                    if (data.length === 1 || item.status === 2) {
                        element.tabChange('sqlTableTab', elId);
                    }
                }
                
                if (item.type === 1 || item.status === 2) {
                    continue;
                }
                
                $("#sqlTableDiv").css('display', 'flex');
                let rowsData = item.data;
                if (!rowsData || rowsData.length === 0) continue;
                
                let headArr = Object.keys(rowsData[0]);
                let head = [];
                for (let key in headArr) {
                    head.push({field: headArr[key], title: headArr[key], sort: true});
                }
                
                let elId = "sqlTable" + index;
                elementTabCount.push(elId);
                element.tabAdd('sqlTableTab', {
                    title: '📋 结果集 ' + index,
                    content: "<table class='layui-table' id='" + elId + "'></table>",
                    id: elId,
                    change: true
                })
                
                table.render({
                    elem: '#' + elId
                    , cols: [head]
                    , data: rowsData
                    , time: item.time
                    , title: '结果集' + (i + 1)
                    , loading: true
                    , height: 260 
                    , cellMinWidth: 150
                    , limit: 50
                    , limits: [50, 500, 1000]
                    , even: true
                    , page: true
                    , text: {none: '查询结果为0条数据'}
                    , size: viewStore.get(tableSizeKey, 'sm')
                });
                
                if (item.type === 0 && item.status !== 2) {
                     element.tabChange('sqlTableTab', elId);
                }
                
                 table.on('rowContextmenu(' + elId + ')', function (obj) {
                 });
            }
        }
        
        window.closeResult = function() {
             $('#result-container').hide();
             // $('.monaco-wrapper').css('height', 'calc(100vh - 50px)');
             if (appState.editor) {
                 setTimeout(() => appState.editor.layout(), 50);
             }
        }



        // 初始化应用
        function initApp() {
            initAppState();
            loadTaskOptions();
            initMonacoEditor();
            setupToolbarActions();
            showSavePage();

            // 未保存更改提示
            window.addEventListener('beforeunload', (e) => {
                if (appState.hasUnsavedChanges) {
                    e.preventDefault();
                    e.returnValue = '您修改的内容未保存，确定要离开吗？';
                    return e.returnValue;
                }
            });
        }

        // 启动应用
        initApp();
    });
</script>
</body>
</html>
