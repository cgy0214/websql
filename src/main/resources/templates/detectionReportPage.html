<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>检测任务报表</title>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/static/img/favicon.ico}" media="screen"/>
    <link rel="stylesheet" th:href="@{/static/css/layui.css}" media="all"/>
    <style>
        .chart-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        .chart-box {
            width: calc(50% - 8px);
            height: 320px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 15px;
            box-sizing: border-box;
        }
        .chart-box-full {
            width: 100%;
            height: 350px;
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .stat-cards {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .stat-card {
            flex: 1;
            padding: 18px 10px;
            border-radius: 8px;
            text-align: center;
            color: #fff;
            max-width: 22%;
        }
        .stat-card-blue { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .stat-card-green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .stat-card-orange { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .stat-card-red { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 0%, #feada6 100%); }
        .stat-card-value {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .stat-card-label {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
<form class="layui-form">
    <div class="layui-panel">
        <div style="margin: 15px;">
            <div class="layui-form-item">
                <label class="layui-form-label">监测任务:</label>
                <div class="layui-input-inline">
                    <select name="taskId" id="taskId" lay-filter="taskId" lay-search=""
                            lay-affix="clear"></select>
                </div>

                <label class="layui-form-label">日期范围:</label>
                <div class="layui-input-inline" style="width: 300px;">
                    <input type="text" class="layui-input" id="date" name="date" placeholder=" - "
                           style="width: 300px;">
                </div>
                <div class="layui-input-inline" style="width: 300px;">
                    <button class="layui-btn layui-btn-primary layui-border-green search-btn" lay-submit
                            lay-filter="table-search">
                        <i class="layui-icon layui-icon-search"> </i>查 询
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="layui-panel" style="margin-top: 15px;">
        <div class="stat-cards" id="statCards">
            <div class="stat-card stat-card-blue">
                <div class="stat-card-value" id="totalCount">-</div>
                <div class="stat-card-label">总检测次数</div>
            </div>
            <div class="stat-card stat-card-green">
                <div class="stat-card-value" id="successCount">-</div>
                <div class="stat-card-label">普通次数</div>
            </div>
            <div class="stat-card stat-card-orange">
                <div class="stat-card-value" id="warningCount">-</div>
                <div class="stat-card-label">紧急次数</div>
            </div>
            <div class="stat-card stat-card-red">
                <div class="stat-card-value" id="errorCount">-</div>
                <div class="stat-card-label">已告警次数</div>
            </div>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-box chart-box-full">
            <div class="chart-title">告警趋势图</div>
            <div id="trendChart" style="width: 100%;height:280px;"></div>
        </div>
        <div class="chart-box">
            <div class="chart-title">告警级别分布</div>
            <div id="alarmLevelChart" style="width: 100%;height:260px;"></div>
        </div>
        <div class="chart-box">
            <div class="chart-title">任务执行状态</div>
            <div id="taskStatusChart" style="width: 100%;height:260px;"></div>
        </div>
        <div class="chart-box">
            <div class="chart-title">数据源检测分布</div>
            <div id="datasourceChart" style="width: 100%;height:260px;"></div>
        </div>
        <div class="chart-box">
            <div class="chart-title">响应时间分布(毫秒)</div>
            <div id="execTimeChart" style="width: 100%;height:260px;"></div>
        </div>
    </div>

    <div class="layui-panel" style="margin-top: 15px;">
        <div class="layui-form nowrap">
            <table class="layui-hide" id="dataTable" lay-filter="dataTable"></table>
        </div>
    </div>
</form>
</body>
<script th:src="@{/static/layui.js}"></script>
<script th:src="@{/static/lay-config.js}"></script>
<script th:src="@{/static/base64.min.js}"></script>
<script th:src="@{/static/echarts.min.js}"></script>
<script th:replace="~{base::ctx}"/>
<script type="text/html" id="toolbarTable">
    <div class="layui-clear-space">
        <a class="layui-btn layui-btn-xs" lay-event="view">SQL内容</a>
    </div>
</script>
<script th:inline="javascript">
    layui.use(['jquery', 'layer', 'form', 'table', 'laytpl', 'laySelect', 'laydate'], function () {
        const layer = layui.layer;
        const form = layui.form;
        const $ = layui.jquery;
        const table = layui.table;
        const laytpl = layui.laytpl;
        const select = layui.laySelect;
        const laydate = layui.laydate;
        let activeId = [[${id}]] == null ? -1 : [[${id}]];

        select.render({
            elem: "#taskId",
            url: ctx + 'detectionManager/findDataSelect?activeId=' + activeId,
            select: 10000,
            title: '请选择要查询的任务',
            format: function (data) {
                return parseSelectData(data);
            },
            success: function (data, activeData) {
                activeId = activeData.length === 0 ? null : activeData[0].code;
            },
            onselect: function (data) {
                activeId = data;
            }
        });

        laydate.render({
            elem: "#date",
            type: "datetime",
            range: true,
            value: getDefaultDateRangeStr(),
            shortcuts: [
                {
                    text: "30分钟",
                    value: function () {
                        const now = new Date();
                        const thirtyMinAgo = new Date(now.getTime() - (60 * 1000 * 30));
                        return [
                            thirtyMinAgo,
                            now
                        ];
                    }
                },
                {
                    text: "1小时",
                    value: function () {
                        const now = new Date();
                        const oneHourAgo = new Date(now.getTime() - (60 * 60 * 1000));
                        return [
                            oneHourAgo,
                            now
                        ];
                    }
                },
                {
                    text: "3小时",
                    value: function () {
                        const now = new Date();
                        const threeHourAgo = new Date(now.getTime() - (60 * 60 * 1000 * 3));
                        return [
                            threeHourAgo,
                            now
                        ];
                    }
                },
                {
                    text: "今天",
                    value: function () {
                        var date = new Date();
                        var year = date.getFullYear();
                        var month = date.getMonth();
                        var day = date.getDate();
                        return [
                            new Date(year, month, day, 0, 0, 0),
                            new Date(year, month, day, 23, 59, 59)
                        ];
                    }
                },
                {
                    text: "昨天",
                    value: function () {
                        var date = new Date();
                        var year = date.getFullYear();
                        var month = date.getMonth();
                        var day = date.getDate()-1;
                        return [
                            new Date(year, month, day, 0, 0, 0),
                            new Date(year, month, day, 23, 59, 59)
                        ];
                    }
                },
            ]
        });

        function getDefaultDateRangeStr() {
            const now = new Date();
            const thirtyMinAgo = new Date(now.getTime() - (30 * 60 * 1000));
            const formatDate = function(d) {
                var y = d.getFullYear();
                var m = (d.getMonth() + 1).toString().padStart(2, '0');
                var dd = d.getDate().toString().padStart(2, '0');
                var h = d.getHours().toString().padStart(2, '0');
                var min = d.getMinutes().toString().padStart(2, '0');
                var s = d.getSeconds().toString().padStart(2, '0');
                return y + '-' + m + '-' + dd + ' ' + h + ':' + min + ':' + s;
            };
            return formatDate(thirtyMinAgo) + ' - ' + formatDate(now);
        }

        table.render({
            elem: '#dataTable',
            url: ctx + 'detectionManager/logList?taskId=' + activeId,
            defaultToolbar: ['filter', 'exports', 'print'],
            page: true,
            height: '525',
            toolbar: "<div>监测任务记录</div>",
            cols: [
                [
                    {field: 'taskId', title: '任务ID', sort: true, fixed: true, width: 100},
                    {field: 'name', title: '名称', sort: true, fixed: true},
                    {field: 'dataBaseName', title: '数据源', sort: true, fixed: true},
                    {field: 'data', title: '结果值', sort: true, fixed: true},
                    {field: 'execTime', title: '耗时', sort: true, fixed: true, width: 100},
                    {field: 'alarmLevel', title: '告警级别', sort: true, fixed: true, width: 100},
                    {field: 'stateName', title: '是否告警', sort: true, fixed: true, width: 100},
                    {field: 'errorMessage', title: '描述', sort: true, fixed: true},
                    {field: 'createTime', title: '创建时间', sort: true, fixed: true, width: 200},
                    {fixed: 'right', title: '操作', width: 100, toolbar: '#toolbarTable'}
                ]
            ],
            parseData: res => parseData(res)
        });

        table.on('tool(dataTable)', function (obj) {
            var data = obj.data;
            switch (obj.event) {
                case 'view':
                    let str = Base64.decode(data.sqlContent) || "";
                    const content = laytpl('<div style="margin: 5px;"><pre class="layui-code">{{= d.content}}</pre></div>')
                        .render({content: str});
                    openContent("查看作业SQL内容", content);
                    break;
            }
        });

        let dateRange = getDefaultDateRange();
        
        form.on('submit(table-search)', function (data) {
            const field = data.field;
            if (field.date) {
                dateRange = field.date.split(" - ");
            }
            field.beginDate = dateRange[0];
            field.endDate = dateRange[1];
            field.page = 1;
            table.reloadData('dataTable', {
                scrollPos: true,
                url: ctx + 'detectionManager/logList',
                where: field,
                page: {curr: 1}
            });
            loadChartData();
            return false;
        });

        let trendChart = echarts.init(document.getElementById('trendChart'));
        let alarmLevelChart = echarts.init(document.getElementById('alarmLevelChart'));
        let taskStatusChart = echarts.init(document.getElementById('taskStatusChart'));
        let datasourceChart = echarts.init(document.getElementById('datasourceChart'));
        let execTimeChart = echarts.init(document.getElementById('execTimeChart'));

        function initCharts() {
            const commonOption = {
                tooltip: { trigger: 'axis' },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true }
            };
            
            trendChart.setOption({
                ...commonOption,
                title: { text: '' },
                tooltip: { trigger: 'axis' },
                legend: { data: ['普通', '紧急'] },
                xAxis: { type: 'category', data: [], boundaryGap: false },
                yAxis: { type: 'value' },
                series: [
                    { name: '普通', type: 'line', smooth: true, data: [], itemStyle: { color: '#10b981' }, areaStyle: { opacity: 0.3 } },
                    { name: '紧急', type: 'line', smooth: true, data: [], itemStyle: { color: '#ef4444' }, areaStyle: { opacity: 0.3 } }
                ]
            });

            alarmLevelChart.setOption({
                ...commonOption,
                tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                legend: { orient: 'vertical', left: 'left' },
                series: [{ type: 'pie', radius: ['40%', '70%'], data: [], label: { show: true } }]
            });

            taskStatusChart.setOption({
                ...commonOption,
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: [] },
                yAxis: { type: 'value' },
                series: [
                    { name: '未告警', type: 'bar', stack: 'total', data: [], itemStyle: { color: '#10b981' } },
                    { name: '已告警', type: 'bar', stack: 'total', data: [], itemStyle: { color: '#ef4444' } }
                ]
            });

            datasourceChart.setOption({
                ...commonOption,
                tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                legend: { orient: 'vertical', left: 'left' },
                series: [{ type: 'pie', radius: ['40%', '70%'], data: [], label: { show: true } }]
            });

            execTimeChart.setOption({
                ...commonOption,
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: ['<100ms', '100-500ms', '500ms-1s', '1s-5s', '>5s'] },
                yAxis: { type: 'value' },
                series: [{ type: 'bar', data: [], itemStyle: { color: '#667eea' }, barWidth: '50%' }]
            });

            loadChartData();
        }

        function loadChartData() {
            const requestData = {
                "taskId": activeId ? parseInt(activeId) : null,
                "beginDate": dateRange.length > 0 ? dateRange[0] : null,
                "endDate": dateRange.length > 1 ? dateRange[1] : null
            };

            post(ctx + "detectionManager/logCharts", requestData, (res) => {
                if (res.code === 200) {
                    const data = res.data;
                    updateStatCards(data.statData);
                    updateTrendChart(data.trendData);
                    updateAlarmLevelChart(data.alarmLevelData);
                    updateTaskStatusChart(data.taskStatusData);
                    updateDatasourceChart(data.datasourceData);
                    updateExecTimeChart(data.execTimeData);
                }
            });
        }

        function updateStatCards(statData) {
            document.getElementById('totalCount').textContent = statData.total || 0;
            document.getElementById('successCount').textContent = statData.normal || 0;
            document.getElementById('warningCount').textContent = statData.urgent || 0;
            document.getElementById('errorCount').textContent = statData.alarm || 0;
        }

        function updateTrendChart(trendData) {
            trendChart.setOption({
                xAxis: { data: trendData.timeList },
                series: [
                    { data: trendData.normalList },
                    { data: trendData.urgentList }
                ]
            });
        }

        function updateAlarmLevelChart(alarmLevelData) {
            alarmLevelChart.setOption({
                series: [{ data: alarmLevelData }]
            });
        }

        function updateTaskStatusChart(taskStatusData) {
            taskStatusChart.setOption({
                xAxis: { data: taskStatusData.taskNames },
                series: [
                    { data: taskStatusData.noAlarmList },
                    { data: taskStatusData.hasAlarmList }
                ]
            });
        }

        function updateDatasourceChart(datasourceData) {
            datasourceChart.setOption({
                series: [{ data: datasourceData }]
            });
        }

        function updateExecTimeChart(execTimeData) {
            execTimeChart.setOption({
                series: [{ data: execTimeData }]
            });
        }

        initCharts();
        
        function getDefaultDateRange() {
            const now = new Date();
            const thirtyMinAgo = new Date(now.getTime() - (30 * 60 * 1000));
            const formatDate = function(d) {
                var y = d.getFullYear();
                var m = (d.getMonth() + 1).toString().padStart(2, '0');
                var dd = d.getDate().toString().padStart(2, '0');
                var h = d.getHours().toString().padStart(2, '0');
                var min = d.getMinutes().toString().padStart(2, '0');
                var s = d.getSeconds().toString().padStart(2, '0');
                return y + '-' + m + '-' + dd + ' ' + h + ':' + min + ':' + s;
            };
            return [formatDate(thirtyMinAgo), formatDate(now)];
        }
        
        window.addEventListener('resize', function() {
            trendChart.resize();
            alarmLevelChart.resize();
            taskStatusChart.resize();
            datasourceChart.resize();
            execTimeChart.resize();
        });
    });
</script>
</html>
